<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JARVIS">
  <meta name="theme-color" content="#00d4ff">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">
  <title>JARVIS</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,sans-serif;background:#050510;color:#e8e8e8;height:100vh;overflow:hidden}

    /* Animated mesh gradient background */
    .bg{position:fixed;inset:0;z-index:0}
    .bg canvas{width:100%;height:100%}

    /* Main container */
    .app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column}

    /* Top bar */
    .topbar{padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
    .topbar .logo{display:flex;align-items:center;gap:8px}
    .topbar .dot{width:8px;height:8px;border-radius:50%;background:#00ff88;box-shadow:0 0 6px #00ff88;animation:blink 2s infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
    .topbar h1{font-size:16px;font-weight:600;color:#fff;letter-spacing:2px}
    .topbar .status{font-size:11px;color:rgba(255,255,255,.4);letter-spacing:1px}

    /* Center orb area */
    .orb-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
    .orb-container{position:relative;width:180px;height:180px;cursor:pointer}
    .orb{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(0,212,255,.25),rgba(123,47,247,.1) 60%,transparent);border:1.5px solid rgba(0,212,255,.2);display:flex;align-items:center;justify-content:center;transition:all .3s;backdrop-filter:blur(10px)}
    .orb:hover{border-color:rgba(0,212,255,.4);box-shadow:0 0 50px rgba(0,212,255,.2)}
    .orb.speaking{animation:orbGlow 1.5s ease-in-out infinite;border-color:rgba(0,212,255,.5);box-shadow:0 0 80px rgba(0,212,255,.3),0 0 160px rgba(123,47,247,.15)}
    .orb.listening{border-color:rgba(0,255,136,.5);box-shadow:0 0 60px rgba(0,255,136,.3);animation:orbGlow 1s ease-in-out infinite}
    @keyframes orbGlow{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    .orb-rings{position:absolute;inset:-20px;border-radius:50%;border:1px solid rgba(0,212,255,.08);animation:spin 20s linear infinite}
    .orb-rings::after{content:'';position:absolute;inset:-15px;border-radius:50%;border:1px solid rgba(123,47,247,.06);animation:spin 30s linear infinite reverse}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    .orb-icon{width:50px;height:50px;fill:rgba(0,212,255,.7)}
    .orb-text{margin-top:20px;font-size:13px;color:rgba(0,212,255,.6);letter-spacing:1px;min-height:20px;text-align:center}

    /* Chat area */
    .chat-area{position:absolute;bottom:0;left:0;right:0;max-height:55vh;display:flex;flex-direction:column;background:linear-gradient(to top,rgba(5,5,16,.98),rgba(5,5,16,.9) 80%,transparent);padding:0 16px 16px;pointer-events:none;opacity:0;transform:translateY(20px);transition:all .3s}
    .chat-area.visible{opacity:1;transform:translateY(0);pointer-events:all}
    .messages{flex:1;overflow-y:auto;padding:12px 0;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
    .messages::-webkit-scrollbar{width:3px}
    .messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
    .msg{max-width:85%;margin:6px 0;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;animation:msgIn .2s ease}
    @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .msg.user{margin-left:auto;background:linear-gradient(135deg,rgba(0,212,255,.15),rgba(123,47,247,.1));border:1px solid rgba(0,212,255,.15);color:#c8f0ff;border-bottom-right-radius:4px}
    .msg.assistant{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);color:#e0e0e0;border-bottom-left-radius:4px}
    .msg.typing{color:#00d4ff;font-style:italic;background:none;border:none;font-size:12px;padding:4px 8px}

    /* Input bar */
    .input-bar{display:flex;gap:8px;align-items:center;padding-top:10px}
    .input-bar input{flex:1;padding:12px 16px;border-radius:24px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#fff;font-size:14px;outline:none;backdrop-filter:blur(10px);transition:all .2s}
    .input-bar input:focus{border-color:rgba(0,212,255,.3);background:rgba(255,255,255,.05)}
    .input-bar input::placeholder{color:rgba(255,255,255,.25)}
    .btn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;backdrop-filter:blur(10px)}
    .btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
    .btn svg{width:18px;height:18px}
    .btn-send svg{fill:#00d4ff}
    .btn-mic svg{fill:#00ff88}
    .btn-mic.active{background:rgba(255,70,70,.15);border-color:rgba(255,70,70,.3);animation:micPulse 1s infinite}
    .btn-mic.active svg{fill:#ff4444}
    @keyframes micPulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 6px rgba(255,70,70,.1)}}
    .btn-stop{display:none;background:rgba(255,70,70,.1);border-color:rgba(255,70,70,.2)}
    .btn-stop svg{fill:#ff4444}

    /* Mobile */
    @media(max-width:480px){
      .orb-container{width:140px;height:140px}
      .orb{width:140px;height:140px}
      .orb-icon{width:38px;height:38px}
      .chat-area{max-height:60vh}
    }
  </style>
</head>
<body>
  <div class="bg"><canvas id="bgCanvas"></canvas></div>

  <div class="app">
    <div class="topbar">
      <div class="logo"><div class="dot"></div><h1>JARVIS</h1></div>
      <div class="status" id="status">Ready</div>
    </div>

    <div class="orb-area">
      <div class="orb-container" id="orbContainer" onclick="handleOrbClick()">
        <div class="orb-rings"></div>
        <div class="orb" id="orb">
          <svg class="orb-icon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
        </div>
      </div>
      <div class="orb-text" id="orbText">Tap to talk</div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="messages" id="messages"></div>
      <div class="input-bar">
        <input type="text" id="input" placeholder="Ask JARVIS anything..." autocomplete="off"/>
        <button class="btn btn-mic" id="micBtn" onclick="toggleMic()"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button>
        <button class="btn btn-stop" id="stopBtn" onclick="stopSpeaking()"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
        <button class="btn btn-send" onclick="sendMessage()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
      </div>
    </div>
  </div>

  <script>
    // --- Animated background ---
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, particles = [];
    function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight}
    window.addEventListener('resize',resize);resize();
    for(let i=0;i<50;i++)particles.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*2+1,a:Math.random()*.3});
    function drawBg(){ctx.clearRect(0,0,w,h);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(0,212,255,${p.a})`;ctx.fill()});
    // Draw connections
    for(let i=0;i<particles.length;i++)for(let j=i+1;j<particles.length;j++){const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<120){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle=`rgba(0,212,255,${.05*(1-d/120)})`;ctx.stroke()}}
    requestAnimationFrame(drawBg)}drawBg();

    // --- State ---
    const messages=document.getElementById('messages'),input=document.getElementById('input'),orb=document.getElementById('orb'),orbText=document.getElementById('orbText'),chatArea=document.getElementById('chatArea'),statusEl=document.getElementById('status');
    let sessionId=null,currentAudio=null,isRecording=false,recognition=null;
    window.jarvisMode='check';

    // Show chat area when there are messages
    function showChat(){chatArea.classList.add('visible')}
    input.addEventListener('focus',showChat);
    input.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});

    // --- Auth ---
    (async()=>{
      try{
        const r=await fetch('/auth/status');const d=await r.json();
        if(d.needsSetup){window.jarvisMode='setup';showChat();addMsg("Welcome. Set a password to secure your AI (min 6 chars):","assistant")}
        else{window.jarvisMode='login';showChat();addMsg("Enter your password to unlock JARVIS:","assistant")}
      }catch{showChat();addMsg("Connecting...","assistant")}
    })();

    // --- Send ---
    async function sendMessage(){
      const msg=input.value.trim();if(!msg)return;input.value='';
      if(window.jarvisMode==='setup'||window.jarvisMode==='login'){
        addMsg('••••••••','user');
        const ep=window.jarvisMode==='setup'?'/auth/setup':'/auth/login';
        try{const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:msg})});const d=await r.json();
          if(d.token){window.jarvisToken=d.token;window.jarvisMode='chat';orbText.textContent='Tap to talk';statusEl.textContent='Online';addMsg("Unlocked. I'm ready. What do you need?","assistant");speak("Unlocked. I'm ready. What do you need?")}
          else addMsg(d.error||'Auth failed','assistant')}catch(e){addMsg('Connection error','assistant')}return}
      showChat();addMsg(msg,'user');statusEl.textContent='Thinking...';orb.classList.add('speaking');orbText.textContent='Processing...';
      const typing=addMsg('...','typing');
      try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(window.jarvisToken||'')},body:JSON.stringify({message:msg,sessionId})});
        const d=await r.json();typing.remove();orb.classList.remove('speaking');statusEl.textContent='Online';orbText.textContent='';
        if(d.error){addMsg('Error: '+d.error,'assistant')}
        else{sessionId=d.sessionId;addMsg(d.reply,'assistant');
          if(d.action==='play_music'&&d.musicUrl)window.open(d.musicUrl,'_blank');
          else speak(d.reply)}}
      catch(e){typing.remove();orb.classList.remove('speaking');statusEl.textContent='Online';orbText.textContent='';addMsg('Connection error','assistant')}
      input.focus()}

    // --- TTS ---
    function speak(text){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);u.rate=1.0;u.pitch=1.1;
      const voices=window.speechSynthesis.getVoices();
      const v=voices.find(v=>/zira|female|samantha|karen|fiona|hazel|susan/i.test(v.name)&&v.lang.startsWith('en'))||voices.find(v=>v.lang.startsWith('en-'));
      if(v)u.voice=v;
      orb.classList.add('speaking');orbText.textContent='Speaking...';statusEl.textContent='Speaking';document.getElementById('stopBtn').style.display='flex';
      u.onend=()=>{orb.classList.remove('speaking');orbText.textContent='Tap to talk';statusEl.textContent='Online';document.getElementById('stopBtn').style.display='none';currentAudio=null};
      currentAudio=u;window.speechSynthesis.speak(u)}
    window.speechSynthesis.getVoices();

    function stopSpeaking(){if('speechSynthesis' in window)window.speechSynthesis.cancel();currentAudio=null;orb.classList.remove('speaking','listening');orbText.textContent='Tap to talk';statusEl.textContent='Online';document.getElementById('stopBtn').style.display='none'}

    // --- Voice Input ---
    if('webkitSpeechRecognition' in window||'SpeechRecognition' in window){
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.continuous=false;recognition.interimResults=true;recognition.lang='en-US';
      recognition.onstart=()=>{isRecording=true;document.getElementById('micBtn').classList.add('active');orb.classList.add('listening');orbText.textContent='Listening...';statusEl.textContent='Listening'};
      recognition.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;input.value=t;if(e.results[e.results.length-1].isFinal)setTimeout(()=>{if(input.value.trim())sendMessage()},300)};
      recognition.onend=()=>{isRecording=false;document.getElementById('micBtn').classList.remove('active');if(!currentAudio){orb.classList.remove('listening');orbText.textContent='Tap to talk';statusEl.textContent='Online'}};
      recognition.onerror=e=>{isRecording=false;document.getElementById('micBtn').classList.remove('active');orb.classList.remove('listening');orbText.textContent='Tap to talk';statusEl.textContent='Online'}}

    function toggleMic(){if(!recognition){addMsg('Speech not supported. Use Chrome.','assistant');return}if(isRecording)recognition.stop();else{stopSpeaking();showChat();recognition.start()}}
    function handleOrbClick(){if(window.jarvisMode!=='chat'){input.focus();showChat();return}toggleMic()}

    // --- Helpers ---
    function addMsg(text,cls){const div=document.createElement('div');div.className='msg '+cls;div.textContent=text;messages.appendChild(div);messages.scrollTop=messages.scrollHeight;return div}

    // Service worker
    if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
  </script>
</body>
</html>
