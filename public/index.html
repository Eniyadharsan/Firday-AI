<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a1628">
  <link rel="manifest" href="/manifest.json">
  <title>JARVIS</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Courier New',monospace;background:#0a1628;color:#00e5ff;height:100vh;overflow:hidden}

    /* Iron Man HUD grid lines */
    body::before{content:'';position:fixed;inset:0;background:
      linear-gradient(rgba(0,229,255,.02) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,229,255,.02) 1px,transparent 1px);
      background-size:50px 50px;pointer-events:none;z-index:0}

    /* Scan line effect */
    body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(
      0deg,transparent,transparent 2px,rgba(0,229,255,.01) 2px,rgba(0,229,255,.01) 4px);
      pointer-events:none;z-index:999;animation:scanMove 8s linear infinite}
    @keyframes scanMove{from{transform:translateY(0)}to{transform:translateY(4px)}}

    /* Top HUD bar */
    .hud-top{position:fixed;top:0;left:0;right:0;height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid rgba(0,229,255,.1);background:rgba(10,22,40,.8);backdrop-filter:blur(10px);z-index:100}
    .hud-top .left{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:2px;color:rgba(0,229,255,.7)}
    .hud-top .dot{width:6px;height:6px;border-radius:50%;background:#00ff88;box-shadow:0 0 6px #00ff88;animation:blink 2s infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    .hud-top .right{font-size:10px;color:rgba(0,229,255,.4);letter-spacing:1px}

    /* Center orb */
    /* Center molecular structure */
    .center{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:10}
    .molecule{width:180px;height:180px;margin:0 auto;position:relative;cursor:pointer}
    .nucleus{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,rgba(0,229,255,.8),rgba(0,100,255,.3) 70%);box-shadow:0 0 25px rgba(0,229,255,.5),0 0 50px rgba(0,229,255,.2);transition:all .3s}
    .orbit{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(0,229,255,.1);animation:orbit1 8s linear infinite}
    .orbit:nth-child(2){inset:15px;border-color:rgba(123,47,247,.1);animation:orbit2 6s linear infinite;transform:rotateX(60deg)}
    .orbit:nth-child(3){inset:30px;border-color:rgba(0,255,136,.08);animation:orbit3 10s linear infinite;transform:rotateY(60deg)}
    @keyframes orbit1{from{transform:rotateZ(0)}to{transform:rotateZ(360deg)}}
    @keyframes orbit2{from{transform:rotateX(60deg) rotateZ(0)}to{transform:rotateX(60deg) rotateZ(360deg)}}
    @keyframes orbit3{from{transform:rotateY(60deg) rotateZ(0)}to{transform:rotateY(60deg) rotateZ(360deg)}}
    .electron{position:absolute;width:8px;height:8px;border-radius:50%;background:#00e5ff;box-shadow:0 0 8px #00e5ff,0 0 16px rgba(0,229,255,.4);top:-4px;left:50%;margin-left:-4px}
    .orbit:nth-child(2) .electron{background:#7b2ff7;box-shadow:0 0 8px #7b2ff7,0 0 16px rgba(123,47,247,.4)}
    .orbit:nth-child(3) .electron{background:#00ff88;box-shadow:0 0 8px #00ff88,0 0 16px rgba(0,255,136,.4)}
    /* Fast mode when speaking */
    .molecule.speaking .orbit{animation-duration:2s !important}
    .molecule.speaking .nucleus{box-shadow:0 0 40px rgba(0,229,255,.7),0 0 80px rgba(0,229,255,.3);width:35px;height:35px}
    .molecule.listening .orbit{animation-duration:3s !important}
    .molecule.listening .nucleus{background:radial-gradient(circle,rgba(0,255,136,.8),rgba(0,200,100,.3) 70%);box-shadow:0 0 30px rgba(0,255,136,.5)}
    .label{margin-top:20px;font-size:18px;letter-spacing:6px;color:rgba(0,229,255,.6);font-weight:bold}
    .sub-label{font-size:10px;color:rgba(0,229,255,.3);letter-spacing:2px;margin-top:4px}
    .wake-indicator{position:fixed;top:50px;left:50%;transform:translateX(-50%);font-size:9px;color:rgba(0,255,136,.4);letter-spacing:2px;z-index:10}

    /* Bottom-left chat */
    .chat{position:fixed;bottom:16px;left:16px;width:380px;max-height:300px;z-index:100;border-radius:12px;background:rgba(10,22,40,.75);backdrop-filter:blur(16px);border:1px solid rgba(0,229,255,.1);display:flex;flex-direction:column;overflow:hidden}
    .chat-msgs{flex:1;overflow-y:auto;padding:10px 12px;max-height:200px;font-size:12px}
    .chat-msgs::-webkit-scrollbar{width:2px}
    .chat-msgs::-webkit-scrollbar-thumb{background:rgba(0,229,255,.2)}
    .m{margin:4px 0;padding:6px 10px;border-radius:8px;max-width:90%;line-height:1.4}
    .m.u{margin-left:auto;background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.12);color:#80e5ff;border-bottom-right-radius:2px}
    .m.a{background:rgba(0,229,255,.03);border:1px solid rgba(0,229,255,.06);color:#b0e0e6;border-bottom-left-radius:2px}
    .m.t{color:rgba(0,229,255,.4);font-style:italic;background:none;border:none;font-size:11px}
    .chat-in{display:flex;gap:6px;padding:8px 10px;border-top:1px solid rgba(0,229,255,.06)}
    .chat-in input{flex:1;padding:8px 12px;border-radius:20px;border:1px solid rgba(0,229,255,.1);background:rgba(0,229,255,.03);color:#00e5ff;font-family:inherit;font-size:12px;outline:none}
    .chat-in input:focus{border-color:rgba(0,229,255,.3)}
    .chat-in input::placeholder{color:rgba(0,229,255,.2)}
    .ib{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,229,255,.15);background:rgba(0,229,255,.03);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
    .ib:hover{background:rgba(0,229,255,.1);border-color:rgba(0,229,255,.3)}
    .ib svg{width:12px;height:12px;fill:#00e5ff}
    .ib.rec{border-color:rgba(255,60,60,.4);background:rgba(255,60,60,.1)}
    .ib.rec svg{fill:#ff4444}

    /* Right detail panel */
    .detail{position:fixed;top:50px;right:16px;bottom:16px;width:360px;z-index:90;border-radius:12px;background:rgba(10,22,40,.8);backdrop-filter:blur(16px);border:1px solid rgba(0,229,255,.08);display:none;flex-direction:column;overflow:hidden}
    .detail.open{display:flex}
    .detail-head{padding:12px 16px;border-bottom:1px solid rgba(0,229,255,.06);display:flex;justify-content:space-between;align-items:center}
    .detail-head h4{font-size:11px;color:rgba(0,229,255,.5);letter-spacing:2px;font-weight:normal}
    .detail-close{color:rgba(0,229,255,.3);cursor:pointer;font-size:14px}
    .detail-close:hover{color:#ff4444}
    .detail-body{flex:1;overflow-y:auto;padding:14px 16px;font-size:12px;line-height:1.7;color:rgba(0,229,255,.7)}
    .detail-body::-webkit-scrollbar{width:2px}

    /* Watery mouse effect canvas */
    .fx{position:fixed;inset:0;pointer-events:none;z-index:5}

    @media(max-width:500px){.chat{width:calc(100% - 24px);left:12px}.detail{width:calc(100% - 24px);right:12px;left:12px}.molecule{width:130px;height:130px}}
  </style>
</head>
<body>
  <canvas class="fx" id="fx"></canvas>

  <div class="hud-top">
    <div class="left"><div class="dot"></div><span>J.A.R.V.I.S</span></div>
    <div class="right" id="status">SYSTEMS NOMINAL</div>
  </div>

  <div class="wake-indicator" id="wakeInd">● ALWAYS LISTENING</div>

  <div class="center">
    <div class="molecule" id="reactor" onclick="handleOrb()">
      <div class="orbit"><div class="electron"></div></div>
      <div class="orbit"><div class="electron"></div></div>
      <div class="orbit"><div class="electron"></div></div>
      <div class="nucleus"></div>
    </div>
    <div class="label">JARVIS</div>
    <div class="sub-label" id="orbSub">SAY "HEY JARVIS"</div>
  </div>

  <div class="chat">
    <div class="chat-msgs" id="msgs"></div>
    <div class="chat-in">
      <input id="inp" placeholder="Command..." autocomplete="off"/>
      <button class="ib" id="mic" onclick="toggleMic()"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button>
      <button class="ib" id="stp" style="display:none" onclick="stopTTS()"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
      <button class="ib" onclick="send()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </div>
  </div>

  <div class="detail" id="det">
    <div class="detail-head"><h4>ANALYSIS</h4><div class="detail-close" onclick="closeDet()">✕</div></div>
    <div class="detail-body" id="detBody"></div>
  </div>

  <script>
    // --- Watery FX canvas ---
    const fxc=document.getElementById('fx'),fxctx=fxc.getContext('2d');
    let fw,fh;function fxResize(){fw=fxc.width=innerWidth;fh=fxc.height=innerHeight}addEventListener('resize',fxResize);fxResize();
    let drops=[];
    document.addEventListener('mousemove',e=>{drops.push({x:e.clientX,y:e.clientY,r:0,max:60+Math.random()*30,a:.35,h:180+Math.random()*40});if(drops.length>20)drops.shift()});
    document.addEventListener('click',e=>{for(let i=0;i<4;i++)drops.push({x:e.clientX+Math.random()*20-10,y:e.clientY+Math.random()*20-10,r:0,max:100+Math.random()*50,a:.5,h:170+Math.random()*60})});
    function fxDraw(){fxctx.clearRect(0,0,fw,fh);
      drops=drops.filter(d=>{d.r+=1.5;d.a-=.006;if(d.a<=0)return false;
        fxctx.beginPath();fxctx.arc(d.x,d.y,d.r,0,Math.PI*2);
        fxctx.strokeStyle=`hsla(${d.h},100%,60%,${d.a})`;fxctx.lineWidth=1;fxctx.stroke();
        const g=fxctx.createRadialGradient(d.x,d.y,0,d.x,d.y,d.r*.7);
        g.addColorStop(0,`hsla(${d.h},100%,50%,${d.a*.08})`);g.addColorStop(1,'transparent');
        fxctx.fillStyle=g;fxctx.beginPath();fxctx.arc(d.x,d.y,d.r*.7,0,Math.PI*2);fxctx.fill();
        return true});
      requestAnimationFrame(fxDraw)}fxDraw();

    // --- State ---
    const msgs=document.getElementById('msgs'),inp=document.getElementById('inp'),reactor=document.getElementById('reactor'),orbSub=document.getElementById('orbSub'),statusEl=document.getElementById('status');
    let sid=null,audio=null,rec=false,recognition=null;
    window.jm='check';

    inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});

    // Auth check
    (async()=>{try{const r=await fetch('/auth/status');const d=await r.json();
      showLoginScreen()}catch{msg("Connecting...",'a')}})();

    function showLoginScreen(){
      const login=document.createElement('div');login.id='loginOverlay';
      login.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(10,22,40,.97);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;flex-direction:column';
      login.innerHTML=`
        <div style="text-align:center;margin-bottom:24px">
          <div style="font-size:28px;letter-spacing:6px;color:#00e5ff;font-weight:bold">J.A.R.V.I.S</div>
          <div style="font-size:10px;color:rgba(0,229,255,.3);margin-top:6px;letter-spacing:2px">PERSONAL AI SYSTEM</div>
        </div>
        <div style="width:300px;padding:24px;border-radius:14px;background:rgba(0,229,255,.02);border:1px solid rgba(0,229,255,.1);display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;gap:6px;margin-bottom:6px">
            <button id="tabIn" onclick="showTab('signin')" style="flex:1;padding:7px;border-radius:6px;border:1px solid rgba(0,229,255,.2);background:rgba(0,229,255,.08);color:#00e5ff;font-size:10px;cursor:pointer;letter-spacing:1px;font-family:inherit">SIGN IN</button>
            <button id="tabUp" onclick="showTab('signup')" style="flex:1;padding:7px;border-radius:6px;border:1px solid rgba(0,229,255,.06);background:transparent;color:rgba(0,229,255,.3);font-size:10px;cursor:pointer;letter-spacing:1px;font-family:inherit">SIGN UP</button>
          </div>
          <input id="authEmail" type="email" placeholder="Email" style="padding:9px 12px;border-radius:8px;border:1px solid rgba(0,229,255,.1);background:rgba(0,229,255,.02);color:#00e5ff;font-family:inherit;font-size:12px;outline:none"/>
          <input id="authPwd" type="password" placeholder="Password" style="padding:9px 12px;border-radius:8px;border:1px solid rgba(0,229,255,.1);background:rgba(0,229,255,.02);color:#00e5ff;font-family:inherit;font-size:12px;outline:none"/>
          <input id="authName" type="text" placeholder="Your name" style="padding:9px 12px;border-radius:8px;border:1px solid rgba(0,229,255,.1);background:rgba(0,229,255,.02);color:#00e5ff;font-family:inherit;font-size:12px;outline:none;display:none"/>
          <button onclick="emailAuth()" style="padding:10px;border-radius:8px;border:none;background:rgba(0,229,255,.12);color:#00e5ff;font-size:11px;cursor:pointer;letter-spacing:1px;font-family:inherit;margin-top:4px">AUTHENTICATE</button>
          <div id="authErr" style="font-size:10px;color:#ff4444;text-align:center;min-height:14px"></div>
        </div>`;
      document.body.appendChild(login);
    }

    window.authTab='signin';
    window.showTab=function(t){
      window.authTab=t;
      document.getElementById('authName').style.display=t==='signup'?'block':'none';
      document.getElementById('tabIn').style.background=t==='signin'?'rgba(0,229,255,.08)':'transparent';
      document.getElementById('tabIn').style.color=t==='signin'?'#00e5ff':'rgba(0,229,255,.3)';
      document.getElementById('tabUp').style.background=t==='signup'?'rgba(0,229,255,.08)':'transparent';
      document.getElementById('tabUp').style.color=t==='signup'?'#00e5ff':'rgba(0,229,255,.3)';
    };

    window.emailAuth=async function(){
      const email=document.getElementById('authEmail').value.trim();
      const pwd=document.getElementById('authPwd').value;
      const name=document.getElementById('authName').value.trim();
      const err=document.getElementById('authErr');err.textContent='';
      if(!email||!pwd){err.textContent='Email and password required';return}

      if(window.authTab==='signin'){
        // Sign in — direct
        try{const r=await fetch('/auth/email/signin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pwd})});
          const d=await r.json();
          if(d.token){window.jt=d.token;window.jm='chat';document.getElementById('loginOverlay').remove();
            msg('Welcome'+(d.user&&d.user.name?', '+d.user.name:'')+'. Online.','a');speak("Systems online. Ready.");statusEl.textContent='OPERATIONAL'}
          else{err.textContent=d.error||'Failed'}}catch{err.textContent='Connection error'}
      } else {
        // Sign up — request OTP first
        if(!window.otpSent){
          try{const r=await fetch('/auth/email/request-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pwd,name})});
            const d=await r.json();
            if(d.success){
              window.otpSent=true;window.signupEmail=email;window.signupPwd=pwd;window.signupName=name;
              // Show OTP input
              document.getElementById('authPwd').style.display='none';
              document.getElementById('authName').style.display='none';
              document.getElementById('authEmail').style.display='none';
              let otpInp=document.getElementById('otpInput');
              if(!otpInp){otpInp=document.createElement('input');otpInp.id='otpInput';otpInp.type='text';otpInp.placeholder='Enter 6-digit code';otpInp.style.cssText='padding:9px 12px;border-radius:8px;border:1px solid rgba(0,229,255,.1);background:rgba(0,229,255,.02);color:#00e5ff;font-family:inherit;font-size:16px;outline:none;text-align:center;letter-spacing:4px';
                document.getElementById('authPwd').parentNode.insertBefore(otpInp,document.getElementById('authPwd'))}
              err.style.color='#00ff88';err.textContent=d.message&&d.message.startsWith('DEV_OTP')?'Code: '+d.message.split(':')[1]:'Code sent to '+email}
            else{err.textContent=d.error||'Failed'}}catch{err.textContent='Connection error'}
        } else {
          // Verify OTP
          const otp=document.getElementById('otpInput').value.trim();
          if(!otp){err.textContent='Enter the verification code';return}
          try{const r=await fetch('/auth/email/verify-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:window.signupEmail,password:window.signupPwd,name:window.signupName,otp})});
            const d=await r.json();
            if(d.token){window.jt=d.token;window.jm='chat';document.getElementById('loginOverlay').remove();
              msg('Welcome'+(d.user&&d.user.name?', '+d.user.name:'')+'. Account verified.','a');speak("Account verified. Systems online.");statusEl.textContent='OPERATIONAL'}
            else{err.style.color='#ff4444';err.textContent=d.error||'Invalid code'}}catch{err.textContent='Connection error'}
        }
      }
    };

    // Send
    async function send(){const t=inp.value.trim();if(!t)return;inp.value='';
      if(window.jm==='setup'||window.jm==='login'){msg('••••••','u');
        try{const r=await fetch(window.jm==='setup'?'/auth/setup':'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:t})});const d=await r.json();
        if(d.token){window.jt=d.token;window.jm='chat';msg("Online. Ready, Sir.",'a');speak("Systems online. Ready, Sir.");statusEl.textContent='OPERATIONAL'}
        else msg(d.error||'Failed','a')}catch{msg('Error','a')}return}

      msg(t,'u');statusEl.textContent='PROCESSING';reactor.classList.add('speaking');orbSub.textContent='ANALYZING';
      const tp=msg('...','t');
      try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(window.jt||'')},body:JSON.stringify({message:t,sessionId:sid})});
        const d=await r.json();tp.remove();reactor.classList.remove('speaking');statusEl.textContent='OPERATIONAL';orbSub.textContent='SAY "HEY JARVIS"';
        if(d.error){msg('Error: '+d.error,'a')}
        else{sid=d.sessionId;const reply=d.reply;
          if(reply.length>250){msg(reply.slice(0,180)+'...','a');openDet(reply)}
          else msg(reply,'a');
          if(d.action==='play_music'&&d.musicUrl)window.open(d.musicUrl,'_blank');
          else speak(reply.slice(0,400))}}
      catch{tp.remove();reactor.classList.remove('speaking');statusEl.textContent='OPERATIONAL';orbSub.textContent='SAY "HEY JARVIS"';msg('Connection error','a')}}

    // TTS
    function speak(t){if(!speechSynthesis)return;speechSynthesis.cancel();
      if(recognition&&rec){try{recognition.stop()}catch{}}
      const u=new SpeechSynthesisUtterance(t);u.rate=1;u.pitch=1.1;
      const v=speechSynthesis.getVoices().find(v=>/zira|female|samantha|karen/i.test(v.name)&&v.lang.startsWith('en'))||speechSynthesis.getVoices().find(v=>v.lang.startsWith('en-'));
      if(v)u.voice=v;reactor.classList.add('speaking');orbSub.textContent='SPEAKING';statusEl.textContent='VOCALIZE';document.getElementById('stp').style.display='flex';
      u.onend=()=>{reactor.classList.remove('speaking');orbSub.textContent='SAY "HEY JARVIS"';statusEl.textContent='OPERATIONAL';document.getElementById('stp').style.display='none';audio=null;startWakeListening()};
      audio=u;speechSynthesis.speak(u)}
    speechSynthesis.getVoices();
    function stopTTS(){speechSynthesis.cancel();audio=null;reactor.classList.remove('speaking','listening');orbSub.textContent='SAY "HEY JARVIS"';statusEl.textContent='OPERATIONAL';document.getElementById('stp').style.display='none';startWakeListening()}

    // Voice — continuous recognition with aggressive restart
    let wakeActive=false;
    if('webkitSpeechRecognition' in window||'SpeechRecognition' in window){
      const S=window.SpeechRecognition||window.webkitSpeechRecognition;
      recognition=new S();
      recognition.continuous=true;
      recognition.interimResults=true;
      recognition.lang='en-US';
      recognition.maxAlternatives=1;

      recognition.onstart=()=>{rec=true;document.getElementById('wakeInd').style.color='rgba(0,255,136,.7)';document.getElementById('mic').classList.add('rec')};
      recognition.onresult=e=>{
        let transcript='';
        for(let i=e.resultIndex;i<e.results.length;i++)transcript+=e.results[i][0].transcript;
        const lower=transcript.toLowerCase().trim();

        if(!wakeActive){
          if(lower.includes('jarvis')||lower.includes('travis')){
            wakeActive=true;reactor.classList.add('listening');orbSub.textContent='LISTENING';statusEl.textContent='ACTIVATED';
            const parts=lower.split(/jarvis|travis/);
            const cmd=(parts[parts.length-1]||'').trim();
            if(cmd.length>2&&e.results[e.results.length-1].isFinal){
              inp.value=cmd;wakeActive=false;reactor.classList.remove('listening');setTimeout(()=>send(),100);
            }
          }
        } else {
          inp.value=transcript.replace(/hey jarvis|jarvis|hey travis|travis/gi,'').trim();
          reactor.classList.add('listening');orbSub.textContent='LISTENING...';
          if(e.results[e.results.length-1].isFinal&&inp.value.trim().length>1){
            wakeActive=false;reactor.classList.remove('listening');setTimeout(()=>send(),100);
          }
        }
      };
      recognition.onend=()=>{rec=false;wakeActive=false;reactor.classList.remove('listening');document.getElementById('mic').classList.remove('rec');
        // AGGRESSIVE RESTART — always keep listening
        if(window.jm==='chat'&&!audio){setTimeout(()=>{try{recognition.start()}catch(e){document.getElementById('wakeInd').style.color='rgba(255,100,100,.4)'}},200)}
        else{document.getElementById('wakeInd').style.color='rgba(0,229,255,.2)'}};
      recognition.onerror=(e)=>{rec=false;wakeActive=false;reactor.classList.remove('listening');document.getElementById('mic').classList.remove('rec');
        if(e.error==='not-allowed'||e.error==='service-not-allowed'){
          document.getElementById('wakeInd').textContent='● MIC BLOCKED - CLICK PAGE';document.getElementById('wakeInd').style.color='rgba(255,100,100,.5)'}
        else{setTimeout(()=>{try{recognition.start()}catch{}},500)}};
    }

    function startWakeListening(){if(recognition&&window.jm==='chat'){try{recognition.start()}catch{}}}

    function toggleMic(){if(!recognition)return;
      if(rec){recognition.stop();orbSub.textContent='SAY "HEY JARVIS"';statusEl.textContent='OPERATIONAL'}
      else{stopTTS();wakeActive=true;reactor.classList.add('listening');orbSub.textContent='LISTENING';statusEl.textContent='VOICE INPUT';
        try{recognition.start()}catch(e){document.getElementById('wakeInd').textContent='● MIC ERROR'}}}
    function handleOrb(){if(window.jm!=='chat'){inp.focus();return}toggleMic()}
    function msg(t,c){const d=document.createElement('div');d.className='m '+c;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}
    function openDet(t){document.getElementById('detBody').innerHTML=t.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong style="color:#00e5ff">$1</strong>');document.getElementById('det').classList.add('open')}
    function closeDet(){document.getElementById('det').classList.remove('open')}

    if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
  </script>
</body>
</html>
