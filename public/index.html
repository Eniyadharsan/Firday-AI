<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#00d4ff">
  <link rel="manifest" href="/manifest.json">
  <title>JARVIS</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'SF Pro Display',-apple-system,sans-serif;background:#050510;color:#e0e0e0;height:100vh;overflow:hidden;user-select:none}

    /* Background particles */
    .bg{position:fixed;inset:0;z-index:0}
    .bg canvas{width:100%;height:100%}

    /* Center orb — always visible */
    .orb-wrap{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;text-align:center}
    .orb{width:160px;height:160px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(0,212,255,.2),rgba(123,47,247,.08) 60%,transparent);border:1px solid rgba(0,212,255,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;position:relative;backdrop-filter:blur(8px)}
    .orb::before{content:'';position:absolute;inset:-15px;border-radius:50%;border:1px solid rgba(0,212,255,.06);animation:spin 25s linear infinite}
    .orb::after{content:'';position:absolute;inset:-30px;border-radius:50%;border:1px solid rgba(123,47,247,.04);animation:spin 40s linear infinite reverse}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    .orb:hover{border-color:rgba(0,212,255,.35);box-shadow:0 0 40px rgba(0,212,255,.15)}
    .orb.speaking{animation:pulse 1.4s ease-in-out infinite;border-color:rgba(0,212,255,.4);box-shadow:0 0 60px rgba(0,212,255,.25)}
    .orb.listening{animation:pulse 1s ease-in-out infinite;border-color:rgba(0,255,136,.4);box-shadow:0 0 50px rgba(0,255,136,.2)}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
    .orb svg{width:44px;height:44px;fill:rgba(0,212,255,.6)}
    .orb-label{margin-top:14px;font-size:11px;color:rgba(0,212,255,.5);letter-spacing:2px}
    .jarvis-title{font-size:13px;font-weight:600;color:rgba(255,255,255,.8);letter-spacing:4px;margin-top:6px}

    /* Bottom-left chat bubble */
    .chat-box{position:fixed;bottom:20px;left:20px;width:360px;max-height:320px;z-index:100;display:flex;flex-direction:column;border-radius:20px;background:rgba(10,10,30,.55);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid rgba(255,255,255,.07);box-shadow:0 10px 40px rgba(0,0,0,.4);overflow:hidden;transition:all .3s}
    .chat-box.collapsed{max-height:54px;border-radius:27px}
    .chat-header{padding:10px 16px;display:flex;align-items:center;gap:8px;cursor:pointer;min-height:54px}
    .chat-header .dot{width:7px;height:7px;border-radius:50%;background:#00ff88;box-shadow:0 0 5px #00ff88}
    .chat-header span{font-size:12px;color:rgba(255,255,255,.5);letter-spacing:1px;flex:1}
    .chat-header .toggle{font-size:16px;color:rgba(255,255,255,.3);transition:transform .2s}
    .chat-box.collapsed .toggle{transform:rotate(180deg)}
    .chat-msgs{flex:1;overflow-y:auto;padding:8px 14px;max-height:180px;scroll-behavior:smooth}
    .chat-msgs::-webkit-scrollbar{width:2px}
    .chat-msgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
    .chat-msg{margin:4px 0;font-size:12px;line-height:1.4;padding:6px 10px;border-radius:12px;max-width:90%;animation:fadeUp .2s ease}
    @keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    .chat-msg.user{margin-left:auto;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.12);color:#b8e8ff;border-bottom-right-radius:3px}
    .chat-msg.assistant{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);color:#d0d0d0;border-bottom-left-radius:3px}
    .chat-msg.typing{color:rgba(0,212,255,.6);font-style:italic;background:none;border:none;padding:2px 10px;font-size:11px}
    .chat-input{display:flex;gap:6px;padding:10px 12px;border-top:1px solid rgba(255,255,255,.04)}
    .chat-input input{flex:1;padding:8px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);color:#fff;font-size:12px;outline:none}
    .chat-input input:focus{border-color:rgba(0,212,255,.2)}
    .chat-input input::placeholder{color:rgba(255,255,255,.2)}
    .cbtn{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
    .cbtn:hover{background:rgba(255,255,255,.06)}
    .cbtn svg{width:13px;height:13px}
    .cbtn-send svg{fill:#00d4ff}
    .cbtn-mic svg{fill:#00ff88}
    .cbtn-mic.active{background:rgba(255,70,70,.15);border-color:rgba(255,70,70,.2)}
    .cbtn-mic.active svg{fill:#ff4444}
    .cbtn-stop{display:none}
    .cbtn-stop svg{fill:#ff4444}

    /* Info panel (right side — opens for detailed results) */
    .info-panel{position:fixed;top:20px;right:20px;bottom:20px;width:380px;z-index:90;border-radius:20px;background:rgba(10,10,30,.5);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid rgba(255,255,255,.06);box-shadow:0 10px 40px rgba(0,0,0,.3);display:none;flex-direction:column;overflow:hidden}
    .info-panel.open{display:flex}
    .info-header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.04)}
    .info-header h3{font-size:13px;color:rgba(0,212,255,.7);letter-spacing:1px;font-weight:500}
    .info-close{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
    .info-close:hover{color:#ff4444;border-color:rgba(255,70,70,.2)}
    .info-content{flex:1;overflow-y:auto;padding:16px 18px;font-size:13px;line-height:1.7;color:rgba(255,255,255,.75)}
    .info-content::-webkit-scrollbar{width:3px}
    .info-content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}

    /* Top status */
    .status-bar{position:fixed;top:16px;left:20px;z-index:50;font-size:10px;color:rgba(255,255,255,.3);letter-spacing:1px;display:flex;align-items:center;gap:6px}
    .status-bar .sdot{width:5px;height:5px;border-radius:50%;background:#00ff88}

    /* Mobile */
    @media(max-width:600px){
      .chat-box{width:calc(100% - 24px);left:12px;bottom:12px;max-height:280px}
      .info-panel{width:calc(100% - 24px);left:12px;right:12px;top:60px;bottom:60px}
      .orb{width:120px;height:120px}
      .orb svg{width:34px;height:34px}
    }
  </style>
</head>
<body>
  <div class="bg"><canvas id="bgCanvas"></canvas></div>

  <div class="status-bar"><div class="sdot"></div><span id="status">ONLINE</span></div>

  <!-- Center orb -->
  <div class="orb-wrap">
    <div class="orb" id="orb" onclick="handleOrbClick()">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
    </div>
    <div class="jarvis-title">JARVIS</div>
    <div class="orb-label" id="orbLabel">TAP TO TALK</div>
  </div>

  <!-- Bottom-left chat -->
  <div class="chat-box" id="chatBox">
    <div class="chat-header" onclick="toggleChat()">
      <div class="dot"></div>
      <span>JARVIS</span>
      <div class="toggle">▼</div>
    </div>
    <div class="chat-msgs" id="msgs"></div>
    <div class="chat-input">
      <input type="text" id="input" placeholder="Ask anything..." autocomplete="off"/>
      <button class="cbtn cbtn-mic" id="micBtn" onclick="toggleMic()"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button>
      <button class="cbtn cbtn-stop" id="stopBtn" onclick="stopSpeaking()"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
      <button class="cbtn cbtn-send" onclick="sendMessage()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </div>
  </div>

  <!-- Right info panel -->
  <div class="info-panel" id="infoPanel">
    <div class="info-header"><h3 id="infoTitle">Details</h3><div class="info-close" onclick="closeInfo()">✕</div></div>
    <div class="info-content" id="infoContent"></div>
  </div>

  <script>
    // BG particles
    const canvas=document.getElementById('bgCanvas'),ctx=canvas.getContext('2d');let w,h,pts=[];
    function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}addEventListener('resize',resize);resize();
    for(let i=0;i<40;i++)pts.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:Math.random()*1.5+.5,a:Math.random()*.2+.05});
    function draw(){ctx.clearRect(0,0,w,h);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(0,212,255,${p.a})`;ctx.fill()});
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<100){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle=`rgba(0,212,255,${.03*(1-d/100)})`;ctx.stroke()}}
    requestAnimationFrame(draw)}draw();

    // State
    const msgs=document.getElementById('msgs'),input=document.getElementById('input'),orb=document.getElementById('orb'),orbLabel=document.getElementById('orbLabel'),statusEl=document.getElementById('status');
    let sessionId=null,currentAudio=null,isRecording=false,recognition=null;
    window.jarvisMode='check';

    function toggleChat(){document.getElementById('chatBox').classList.toggle('collapsed')}
    function openInfo(title,content){document.getElementById('infoTitle').textContent=title;document.getElementById('infoContent').innerHTML=content;document.getElementById('infoPanel').classList.add('open')}
    function closeInfo(){document.getElementById('infoPanel').classList.remove('open')}
    input.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});

    // Auth
    (async()=>{try{const r=await fetch('/auth/status');const d=await r.json();
    if(d.needsSetup){window.jarvisMode='setup';addMsg("Set a password (min 6):","assistant")}
    else{window.jarvisMode='login';addMsg("Password:","assistant")}}catch{addMsg("Connecting...","assistant")}})();

    // Send
    async function sendMessage(){
      const msg=input.value.trim();if(!msg)return;input.value='';
      if(window.jarvisMode==='setup'||window.jarvisMode==='login'){addMsg('••••••','user');
        const ep=window.jarvisMode==='setup'?'/auth/setup':'/auth/login';
        try{const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:msg})});const d=await r.json();
        if(d.token){window.jarvisToken=d.token;window.jarvisMode='chat';addMsg("Ready, Sir.","assistant");speak("Systems online. Ready, Sir.")}
        else addMsg(d.error||'Failed','assistant')}catch{addMsg('Error','assistant')}return}

      addMsg(msg,'user');statusEl.textContent='THINKING';orb.classList.add('speaking');orbLabel.textContent='PROCESSING';
      const typing=addMsg('...','typing');
      try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(window.jarvisToken||'')},body:JSON.stringify({message:msg,sessionId})});
        const d=await r.json();typing.remove();orb.classList.remove('speaking');statusEl.textContent='ONLINE';orbLabel.textContent='TAP TO TALK';
        if(d.error){addMsg('Error: '+d.error,'assistant')}
        else{sessionId=d.sessionId;
          // Short reply in chat, full detail in info panel if long
          const reply=d.reply;
          if(reply.length>200){addMsg(reply.slice(0,150)+'... [tap for more]','assistant');
            // Open detailed panel
            const formatted=reply.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>');
            openInfo('JARVIS',formatted)}
          else{addMsg(reply,'assistant')}
          if(d.action==='play_music'&&d.musicUrl)window.open(d.musicUrl,'_blank');
          else speak(reply.slice(0,300))}}
      catch{typing.remove();orb.classList.remove('speaking');statusEl.textContent='ONLINE';orbLabel.textContent='TAP TO TALK';addMsg('Connection error','assistant')}
    }

    // TTS
    function speak(text){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);u.rate=1.0;u.pitch=1.1;
      const voices=speechSynthesis.getVoices();const v=voices.find(v=>/zira|female|samantha|karen|hazel/i.test(v.name)&&v.lang.startsWith('en'))||voices.find(v=>v.lang.startsWith('en-'));
      if(v)u.voice=v;orb.classList.add('speaking');orbLabel.textContent='SPEAKING';statusEl.textContent='SPEAKING';document.getElementById('stopBtn').style.display='flex';
      u.onend=()=>{orb.classList.remove('speaking');orbLabel.textContent='TAP TO TALK';statusEl.textContent='ONLINE';document.getElementById('stopBtn').style.display='none';currentAudio=null};
      currentAudio=u;speechSynthesis.speak(u)}
    speechSynthesis.getVoices();

    function stopSpeaking(){speechSynthesis.cancel();currentAudio=null;orb.classList.remove('speaking','listening');orbLabel.textContent='TAP TO TALK';statusEl.textContent='ONLINE';document.getElementById('stopBtn').style.display='none'}

    // Voice
    if('webkitSpeechRecognition' in window||'SpeechRecognition' in window){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.continuous=false;recognition.interimResults=true;recognition.lang='en-US';
      recognition.onstart=()=>{isRecording=true;document.getElementById('micBtn').classList.add('active');orb.classList.add('listening');orbLabel.textContent='LISTENING';statusEl.textContent='LISTENING'};
      recognition.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;input.value=t;if(e.results[e.results.length-1].isFinal)setTimeout(()=>{if(input.value.trim())sendMessage()},300)};
      recognition.onend=()=>{isRecording=false;document.getElementById('micBtn').classList.remove('active');if(!currentAudio){orb.classList.remove('listening');orbLabel.textContent='TAP TO TALK';statusEl.textContent='ONLINE'}};
      recognition.onerror=()=>{isRecording=false;document.getElementById('micBtn').classList.remove('active');orb.classList.remove('listening');orbLabel.textContent='TAP TO TALK';statusEl.textContent='ONLINE'}}

    function toggleMic(){if(!recognition)return;if(isRecording)recognition.stop();else{stopSpeaking();recognition.start()}}
    function handleOrbClick(){if(window.jarvisMode!=='chat'){input.focus();return}toggleMic()}
    function addMsg(t,c){const d=document.createElement('div');d.className='chat-msg '+c;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}

    if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
  </script>
</body>
</html>
