<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JARVIS">
  <meta name="theme-color" content="#00d4ff">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">
  <title>JARVIS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      overflow: hidden;
    }
    .bg-orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.3; animation: float 8s ease-in-out infinite; }
    .orb1 { width: 400px; height: 400px; background: #00d4ff; top: -100px; left: -100px; }
    .orb2 { width: 300px; height: 300px; background: #7b2ff7; bottom: -50px; right: -50px; animation-delay: 3s; }
    .orb3 { width: 200px; height: 200px; background: #00ff88; top: 50%; left: 50%; animation-delay: 5s; }
    @keyframes float { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(30px,-30px) scale(1.1)} }

    .bubble-trigger {
      position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px;
      border-radius: 50%; background: rgba(0,212,255,0.2);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 1000;
      box-shadow: 0 8px 32px rgba(0,212,255,0.3), inset 0 0 20px rgba(255,255,255,0.05);
      transition: all 0.3s;
    }
    .bubble-trigger:hover { transform: scale(1.1); box-shadow: 0 8px 40px rgba(0,212,255,0.5); }
    .bubble-trigger svg { width: 28px; height: 28px; fill: #00d4ff; }
    .bubble-trigger.hidden { display: none; }

    .chat-panel {
      position: fixed; bottom: 30px; right: 30px; width: 400px; height: 560px;
      border-radius: 24px; background: rgba(15,15,30,0.6);
      backdrop-filter: blur(24px) saturate(1.5); -webkit-backdrop-filter: blur(24px) saturate(1.5);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      display: none; flex-direction: column; overflow: hidden; z-index: 1001;
      animation: slideUp 0.3s ease;
    }
    .chat-panel.open { display: flex; }
    @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

    .panel-header {
      padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .panel-header .title { display: flex; align-items: center; gap: 10px; }
    .panel-header .dot { width: 10px; height: 10px; border-radius: 50%; background: #00ff88; box-shadow: 0 0 8px #00ff88; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .panel-header h2 { font-size: 16px; color: #fff; font-weight: 600; letter-spacing: 1px; }
    .close-btn {
      width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1); color: #aaa; font-size: 18px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .close-btn:hover { background: rgba(255,70,70,0.2); color: #ff4444; }

    .messages { flex: 1; overflow-y: auto; padding: 16px; scroll-behavior: smooth; }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    .msg { max-width: 85%; margin: 8px 0; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
    .msg.user { margin-left: auto; background: rgba(0,212,255,0.15); border: 1px solid rgba(0,212,255,0.2); color: #c0efff; border-bottom-right-radius: 4px; }
    .msg.assistant { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: #e0e0e0; border-bottom-left-radius: 4px; }
    .msg.typing { color: #00d4ff; font-style: italic; background: none; border: none; padding: 4px 14px; }

    .input-bar { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; gap: 8px; align-items: center; }
    .input-bar input {
      flex: 1; padding: 10px 14px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
      color: #fff; font-size: 14px; outline: none; transition: border-color 0.2s;
    }
    .input-bar input:focus { border-color: rgba(0,212,255,0.4); }
    .input-bar input::placeholder { color: rgba(255,255,255,0.3); }
    .input-bar button { width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .send-btn { background: rgba(0,212,255,0.2); border: 1px solid rgba(0,212,255,0.3) !important; }
    .send-btn:hover { background: rgba(0,212,255,0.4); }
    .send-btn svg { width: 16px; height: 16px; fill: #00d4ff; }
    .stop-btn { background: rgba(255,70,70,0.2); border: 1px solid rgba(255,70,70,0.3) !important; display: none; }
    .stop-btn svg { width: 14px; height: 14px; fill: #ff4444; }
    .mic-btn { background: rgba(0,255,136,0.15); border: 1px solid rgba(0,255,136,0.3) !important; }
    .mic-btn:hover { background: rgba(0,255,136,0.3); }
    .mic-btn svg { width: 16px; height: 16px; fill: #00ff88; }
    .mic-btn.recording { background: rgba(255,70,70,0.3); border-color: rgba(255,70,70,0.5) !important; animation: micPulse 1s infinite; }
    .mic-btn.recording svg { fill: #ff4444; }
    @keyframes micPulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,70,70,0.3)} 50%{box-shadow:0 0 0 8px rgba(255,70,70,0)} }

    .center-brand { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; z-index: 1; }
    .center-brand h1 { font-size: 48px; font-weight: 700; background: linear-gradient(135deg,#00d4ff,#7b2ff7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 8px; }

    /* Mobile responsive */
    @media (max-width: 480px) {
      .chat-panel { width: 100%; height: 100%; bottom: 0; right: 0; border-radius: 0; }
      .center-brand h1 { font-size: 32px; }
      .speaking-orb { width: 100px; height: 100px; }
      .speaking-orb::before { width: 130px; height: 130px; }
      .speaking-orb::after { width: 155px; height: 155px; }
      .bubble-trigger { bottom: 20px; right: 20px; width: 55px; height: 55px; }
    }
    .center-brand p { color: rgba(255,255,255,0.4); font-size: 14px; margin-top: 8px; letter-spacing: 2px; }

    /* Speaking orb */
    .speaking-orb {
      width: 140px; height: 140px; margin: 0 auto 20px;
      border-radius: 50%; position: relative;
      background: radial-gradient(circle, rgba(0,212,255,0.2) 0%, rgba(123,47,247,0.05) 70%, transparent 100%);
      border: 1px solid rgba(0,212,255,0.15);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s ease, box-shadow 0.3s;
      cursor: pointer; overflow: hidden;
    }
    .speaking-orb::before, .speaking-orb::after {
      content: ''; position: absolute; border-radius: 50%;
      border: 1px solid rgba(0,212,255,0.1);
      transition: all 0.3s;
    }
    .speaking-orb::before { width: 170px; height: 170px; }
    .speaking-orb::after { width: 200px; height: 200px; }
    .speaking-orb:hover {
      box-shadow: 0 0 40px rgba(0,212,255,0.3);
      border-color: rgba(0,212,255,0.3);
    }
    .speaking-orb:hover::before { border-color: rgba(0,212,255,0.2); transform: scale(1.05); }
    .speaking-orb:hover::after { border-color: rgba(123,47,247,0.2); transform: scale(1.05); }
    .speaking-orb.active {
      background: radial-gradient(circle, rgba(0,212,255,0.4) 0%, rgba(123,47,247,0.15) 70%, transparent 100%);
      box-shadow: 0 0 60px rgba(0,212,255,0.4), 0 0 120px rgba(123,47,247,0.2);
      animation: orbPulse 1.2s ease-in-out infinite;
    }
    .speaking-orb.active::before { animation: ringPulse 1.5s ease-in-out infinite; }
    .speaking-orb.active::after { animation: ringPulse 1.5s ease-in-out infinite 0.3s; }
    @keyframes orbPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
    @keyframes ringPulse { 0%,100%{transform:scale(1);opacity:0.5} 50%{transform:scale(1.1);opacity:1} }
    .speaking-orb .icon { width: 40px; height: 40px; fill: #00d4ff; opacity: 0.8; z-index: 2; }
    .speaking-text { color: rgba(0,212,255,0.7); font-size: 12px; margin-top: 12px; letter-spacing: 1px; min-height: 18px; }

    /* Particles inside orb */
    .orb-particle {
      position: absolute; border-radius: 50%; pointer-events: none;
      background: rgba(0,212,255,0.6);
      animation: particleFloat 3s ease-in-out infinite;
    }
    @keyframes particleFloat {
      0%,100% { transform: translate(0,0) scale(1); opacity: 0.6; }
      25% { transform: translate(10px,-15px) scale(1.2); opacity: 1; }
      50% { transform: translate(-8px,-25px) scale(0.8); opacity: 0.4; }
      75% { transform: translate(12px,-10px) scale(1.1); opacity: 0.8; }
    }

    /* Mouse glow follower */
    .mouse-glow {
      position: fixed; width: 200px; height: 200px; border-radius: 50%;
      background: radial-gradient(circle, rgba(0,212,255,0.06) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
      transform: translate(-50%, -50%);
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>
  <div class="mouse-glow" id="mouseGlow"></div>
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>
  <div class="center-brand">
    <div class="speaking-orb" id="speakingOrb">
      <div class="orb-particle" style="width:4px;height:4px;top:30%;left:25%;animation-delay:0s;"></div>
      <div class="orb-particle" style="width:3px;height:3px;top:60%;left:65%;animation-delay:0.5s;"></div>
      <div class="orb-particle" style="width:5px;height:5px;top:45%;left:40%;animation-delay:1s;background:rgba(123,47,247,0.6);"></div>
      <div class="orb-particle" style="width:3px;height:3px;top:25%;left:60%;animation-delay:1.5s;"></div>
      <div class="orb-particle" style="width:4px;height:4px;top:70%;left:35%;animation-delay:2s;background:rgba(0,255,136,0.5);"></div>
      <div class="orb-particle" style="width:2px;height:2px;top:50%;left:75%;animation-delay:2.5s;"></div>
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </div>
    <h1>JARVIS</h1>
    <p class="speaking-text" id="speakingText"></p>
  </div>

  <div class="bubble-trigger" id="bubbleBtn" onclick="toggleChat()">
    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/></svg>
  </div>

  <div class="chat-panel" id="chatPanel">
    <div class="panel-header">
      <div class="title"><div class="dot"></div><h2>JARVIS</h2></div>
      <div class="close-btn" onclick="toggleChat()">✕</div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-bar">
      <input type="text" id="input" placeholder="Ask anything..." autocomplete="off" />
      <button class="mic-btn" id="micBtn" onclick="toggleMic()" title="Hold to talk"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button>
      <button class="stop-btn" id="stopBtn" onclick="stopSpeaking()"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
      <button class="send-btn" onclick="sendMessage()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </div>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const chatPanel = document.getElementById('chatPanel');
    const bubbleBtn = document.getElementById('bubbleBtn');
    let sessionId = null, currentAudio = null;

    function toggleChat() {
      const open = chatPanel.classList.toggle('open');
      bubbleBtn.classList.toggle('hidden', open);
      if (open) input.focus();
    }
    input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

    async function sendMessage() {
      const msg = input.value.trim();
      if (!msg) return;
      input.value = '';
      stopSpeaking();
      addMsg(msg, 'user');
      const typing = addMsg('Thinking...', 'typing');
      try {
        const res = await fetch('/chat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({message:msg, sessionId}) });
        const data = await res.json();
        typing.remove();
        if (data.error) { addMsg('Error: '+data.error, 'assistant'); }
        else {
          sessionId = data.sessionId;
          addMsg(data.reply, 'assistant');
          if (data.action === 'play_music' && data.musicUrl) window.open(data.musicUrl, '_blank');
          else speakText(data.reply);
        }
      } catch(e) { typing.remove(); addMsg('Connection error.', 'assistant'); }
      input.focus();
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.0; u.pitch = 1.1;
      const voices = window.speechSynthesis.getVoices();
      const v = voices.find(v => /zira|female|samantha|karen|fiona|hazel|susan/i.test(v.name) && v.lang.startsWith('en'))
        || voices.find(v => /woman|girl/i.test(v.name) && v.lang.startsWith('en'))
        || voices.find(v => v.lang.startsWith('en-') && /female/i.test(v.name))
        || voices.find(v => v.name.includes('Microsoft Zira'))
        || voices.find(v => v.lang.startsWith('en-'));
      if (v) u.voice = v;
      document.getElementById('stopBtn').style.display = 'flex';
      document.getElementById('speakingOrb').classList.add('active');
      document.getElementById('speakingText').textContent = text.length > 60 ? text.slice(0,60) + '...' : text;
      u.onend = () => {
        document.getElementById('stopBtn').style.display = 'none';
        document.getElementById('speakingOrb').classList.remove('active');
        document.getElementById('speakingText').textContent = '';
        currentAudio = null;
      };
      currentAudio = u;
      window.speechSynthesis.speak(u);
    }
    window.speechSynthesis.getVoices();

    function stopSpeaking() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      currentAudio = null;
      document.getElementById('stopBtn').style.display = 'none';
      document.getElementById('speakingOrb').classList.remove('active');
      document.getElementById('speakingText').textContent = '';
    }

    function addMsg(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    setTimeout(async () => {
      // Check auth status
      const status = await fetch('/auth/status').then(r => r.json());
      if (status.needsSetup) {
        addMsg("Welcome! Let's secure your JARVIS. Type a password to set up (min 6 chars):", 'assistant');
        window.jarvisMode = 'setup';
      } else {
        addMsg("Welcome back. Enter your password to unlock JARVIS:", 'assistant');
        window.jarvisMode = 'login';
      }
      toggleChat();
    }, 500);

    // Override sendMessage to handle auth flow
    const originalSendMessage = sendMessage;
    sendMessage = async function() {
      if (window.jarvisMode === 'setup' || window.jarvisMode === 'login') {
        const pwd = input.value.trim();
        if (!pwd) return;
        input.value = '';
        addMsg('••••••••', 'user');

        const endpoint = window.jarvisMode === 'setup' ? '/auth/setup' : '/auth/login';
        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ password: pwd })
          });
          const data = await res.json();
          if (data.token) {
            window.jarvisToken = data.token;
            window.jarvisMode = 'chat';
            addMsg(window.jarvisMode === 'setup' ? "Your JARVIS is now encrypted and protected. Only you can access it. How can I help?" : "Unlocked. How can I help you today?", 'assistant');
            speakText("Unlocked. How can I help you today?");
          } else {
            addMsg('Error: ' + (data.error || 'Auth failed'), 'assistant');
          }
        } catch(e) { addMsg('Connection error.', 'assistant'); }
        return;
      }
      // Normal chat flow
      const msg = input.value.trim();
      if (!msg) return;
      input.value = '';
      stopSpeaking();
      addMsg(msg, 'user');
      const typing = addMsg('Thinking...', 'typing');
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: {'Content-Type':'application/json', 'Authorization': 'Bearer '+(window.jarvisToken||'')},
          body: JSON.stringify({message:msg, sessionId})
        });
        const data = await res.json();
        typing.remove();
        if (data.error) { addMsg('Error: '+data.error, 'assistant'); }
        else {
          sessionId = data.sessionId;
          addMsg(data.reply, 'assistant');
          if (data.action === 'play_music' && data.musicUrl) window.open(data.musicUrl, '_blank');
          else speakText(data.reply);
        }
      } catch(e) { typing.remove(); addMsg('Connection error.', 'assistant'); }
      input.focus();
    };

    // --- Voice Input (Speech Recognition) ---
    let recognition = null;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isRecording = true;
        document.getElementById('micBtn').classList.add('recording');
        document.getElementById('speakingOrb').classList.add('active');
        document.getElementById('speakingText').textContent = 'Listening...';
        input.placeholder = 'Listening...';
      };

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = 0; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        input.value = transcript;
        // If final result, auto-send
        if (event.results[event.results.length - 1].isFinal) {
          setTimeout(() => {
            if (input.value.trim()) sendMessage();
          }, 300);
        }
      };

      recognition.onend = () => {
        isRecording = false;
        document.getElementById('micBtn').classList.remove('recording');
        if (!currentAudio) {
          document.getElementById('speakingOrb').classList.remove('active');
          document.getElementById('speakingText').textContent = '';
        }
        input.placeholder = 'Ask anything...';
      };

      recognition.onerror = (event) => {
        isRecording = false;
        document.getElementById('micBtn').classList.remove('recording');
        document.getElementById('speakingOrb').classList.remove('active');
        document.getElementById('speakingText').textContent = '';
        input.placeholder = 'Ask anything...';
        if (event.error !== 'no-speech' && event.error !== 'aborted') {
          addMsg('Mic error: ' + event.error, 'assistant');
        }
      };
    }

    function toggleMic() {
      if (!recognition) {
        addMsg('Speech recognition not supported in this browser. Use Chrome.', 'assistant');
        return;
      }
      if (isRecording) {
        recognition.stop();
      } else {
        stopSpeaking();
        recognition.start();
      }
    }

    // Also allow clicking the center orb to start voice
    orb.addEventListener('click', () => {
      if (window.jarvisMode !== 'chat') return;
      toggleMic();
    });

    // --- Mouse interaction ---
    const mouseGlow = document.getElementById('mouseGlow');
    const orb = document.getElementById('speakingOrb');

    document.addEventListener('mousemove', (e) => {
      // Move glow with cursor
      mouseGlow.style.left = e.clientX + 'px';
      mouseGlow.style.top = e.clientY + 'px';

      // Orb reacts to mouse — tilts toward cursor
      const orbRect = orb.getBoundingClientRect();
      const orbCenterX = orbRect.left + orbRect.width / 2;
      const orbCenterY = orbRect.top + orbRect.height / 2;
      const deltaX = (e.clientX - orbCenterX) / 30;
      const deltaY = (e.clientY - orbCenterY) / 30;
      const dist = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

      if (dist < 15) {
        // Close to orb — stronger reaction
        orb.style.transform = 'translate(' + (deltaX * 0.5) + 'px,' + (deltaY * 0.5) + 'px)';
        orb.style.boxShadow = '0 0 ' + (30 + dist * 2) + 'px rgba(0,212,255,' + (0.2 + dist * 0.02) + ')';
      } else {
        orb.style.transform = 'translate(0,0)';
        if (!orb.classList.contains('active')) {
          orb.style.boxShadow = '';
        }
      }
    });

    // Orb visual feedback on hover
    orb.addEventListener('mouseenter', () => {
      if (!currentAudio && !isRecording) {
        document.getElementById('speakingText').textContent = 'Click to talk';
      }
    });
    orb.addEventListener('mouseleave', () => {
      if (!currentAudio && !isRecording) {
        document.getElementById('speakingText').textContent = '';
      }
    });

    // --- Register Service Worker for PWA ---
    if ('serviceWorker' in navigator) {
