<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a1628">
  <link rel="manifest" href="/manifest.json">
  <title>JARVIS</title>
  <style>
    /* ═══════════════════════════════════════════════════════════════
       JARVIS — Cosmic Universe Orb
       Organic particle-mesh sphere (canvas-rendered) in blue
       centered in a deep space universe. Speech-rate pulsation.
    ═══════════════════════════════════════════════════════════════ */
    :root {
      --accent: #00e5ff;
      --accent-dim: rgba(0, 229, 255, 0.4);
      --listening: #00ff88;
    }

    @keyframes scanLine {
      from { transform: translateY(0); }
      to { transform: translateY(4px); }
    }

    /* The orb is rendered on a canvas — these are just container styles */
    #reactor {
      cursor: pointer;
      position: relative;
      width: 300px;
      height: 300px;
      margin: 0 auto;
    }

    #orbCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Neural Orb Elements */
    .neural-orb {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, #00e5ff 0%, #0040ff 100%);
      box-shadow: 0 0 60px rgba(0, 229, 255, 0.6), 0 0 120px rgba(0, 64, 255, 0.3);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      will-change: transform, opacity;
      transition: all 300ms ease;
    }

    .neural-connections {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .connection {
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--length, 80px);
      height: 2px;
      background: rgba(0, 229, 255, 0.3);
      transform-origin: left center;
      transform: rotate(var(--angle, 0deg));
    }

    .connection .pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00e5ff;
      position: absolute;
      top: -2px;
    }

    .particle-system {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: var(--size, 2px);
      height: var(--size, 2px);
      border-radius: 50%;
      background: rgba(0, 229, 255, 0.6);
      top: 50%;
      left: 50%;
      will-change: transform, opacity;
    }

    /* ── Speaking State ── */
    .speaking .neural-orb {
      transform: translate(-50%, -50%) scale(1.15);
      box-shadow: 0 0 90px rgba(0, 229, 255, 0.8), 0 0 160px rgba(0, 64, 255, 0.5);
    }

    .speaking .connection .pulse {
      animation-duration: 0.8s;
    }

    .speaking .particle {
      animation-duration: 4s;
    }

    /* ── Listening State ── */
    .listening .neural-orb {
      background: radial-gradient(circle, #00ff88 0%, #00a86b 100%);
      box-shadow: 0 0 70px rgba(0, 255, 136, 0.6), 0 0 130px rgba(0, 168, 107, 0.3);
    }

    .listening .connection {
      background: rgba(0, 255, 136, 0.3);
    }

    .listening .connection .pulse {
      background: #00ff88;
      animation-duration: 1.5s;
    }

    .listening .particle {
      background: rgba(0, 255, 136, 0.6);
      animation-duration: 6s;
    }

    /* ── Responsive ── */
    @media (max-width: 500px) {
      #reactor { width: 220px; height: 220px; }
    }

    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Courier New',monospace;background:#000;color:var(--accent);height:100vh;overflow:hidden}

    /* Deep space universe background */
    body::before{content:'';position:fixed;inset:0;background:
      radial-gradient(ellipse at 50% 50%, rgba(0,20,60,0.3) 0%, transparent 50%);
      pointer-events:none;z-index:0}

    /* No scan lines — pure cosmic void */
    body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:999}

    /* Top HUD bar — cosmic minimal */
    .hud-top{position:fixed;top:0;left:0;right:0;height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid rgba(0,229,255,.04);background:rgba(0,0,0,.7);backdrop-filter:blur(12px);z-index:100}
    .hud-top .left{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:2px;color:rgba(0,229,255,.5)}
    .hud-top .dot{width:6px;height:6px;border-radius:50%;background:#00e5ff;box-shadow:0 0 6px #00e5ff;animation:blink 2s infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    .hud-top .right{font-size:10px;color:rgba(0,229,255,.25);letter-spacing:1px}

    /* Center orb */
    .center{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:10}
    .label{margin-top:20px;font-size:18px;letter-spacing:6px;color:rgba(0,229,255,.6);font-weight:bold}
    .sub-label{font-size:10px;color:rgba(0,229,255,.3);letter-spacing:2px;margin-top:4px}
    .wake-indicator{display:none}

    /* Bottom-left chat — space glass */
    .chat{position:fixed;bottom:16px;left:16px;width:380px;max-height:300px;z-index:100;border-radius:12px;background:rgba(0,0,0,.75);backdrop-filter:blur(16px);border:1px solid rgba(0,229,255,.06);display:flex;flex-direction:column;overflow:hidden}
    .chat-msgs{flex:1;overflow-y:auto;padding:10px 12px;max-height:200px;font-size:12px}
    .chat-msgs::-webkit-scrollbar{width:2px}
    .chat-msgs::-webkit-scrollbar-thumb{background:rgba(0,229,255,.2)}
    .m{margin:4px 0;padding:6px 10px;border-radius:8px;max-width:90%;line-height:1.4}
    .m.u{margin-left:auto;background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.12);color:#80e5ff;border-bottom-right-radius:2px}
    .m.a{background:rgba(0,229,255,.03);border:1px solid rgba(0,229,255,.06);color:#b0e0e6;border-bottom-left-radius:2px}
    .m.t{color:rgba(0,229,255,.4);font-style:italic;background:none;border:none;font-size:11px}
    .chat-in{display:flex;gap:6px;padding:8px 10px;border-top:1px solid rgba(0,229,255,.06)}
    .chat-in input{flex:1;padding:8px 12px;border-radius:20px;border:1px solid rgba(0,229,255,.1);background:rgba(0,229,255,.03);color:#00e5ff;font-family:inherit;font-size:12px;outline:none}
    .chat-in input:focus{border-color:rgba(0,229,255,.3)}
    .chat-in input::placeholder{color:rgba(0,229,255,.2)}
    .ib{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,229,255,.15);background:rgba(0,229,255,.03);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
    .ib:hover{background:rgba(0,229,255,.1);border-color:rgba(0,229,255,.3)}
    .ib svg{width:12px;height:12px;fill:#00e5ff}
    .ib.rec{border-color:rgba(255,60,60,.4);background:rgba(255,60,60,.1)}
    .ib.rec svg{fill:#ff4444}

    /* Right detail panel */
    .detail{position:fixed;top:50px;right:16px;bottom:16px;width:360px;z-index:200;border-radius:12px;background:rgba(10,22,40,.8);backdrop-filter:blur(16px);border:1px solid rgba(0,229,255,.08);display:none;flex-direction:column;overflow:hidden}
    .detail.open{display:flex}
    .detail-head{padding:12px 16px;border-bottom:1px solid rgba(0,229,255,.06);display:flex;justify-content:space-between;align-items:center}
    .detail-head h4{font-size:11px;color:rgba(0,229,255,.5);letter-spacing:2px;font-weight:normal}
    .detail-close{color:rgba(0,229,255,.3);cursor:pointer;font-size:14px}
    .detail-close:hover{color:#ff4444}
    .detail-body{flex:1;overflow-y:auto;padding:14px 16px;font-size:12px;line-height:1.7;color:rgba(0,229,255,.7)}
    .detail-body::-webkit-scrollbar{width:2px}

    /* Watery mouse effect canvas */
    .fx{position:fixed;inset:0;pointer-events:none;z-index:5}

    /* Music Panel - Floating Glassmorphism Overlay */
    .music-panel{position:fixed;bottom:16px;right:16px;max-width:340px;max-height:50vh;overflow-y:auto;background:rgba(10,22,40,0.25);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(0,229,255,0.15);box-shadow:0 8px 20px rgba(0,0,0,0.25);border-radius:16px;z-index:150}
    @supports not (backdrop-filter: blur(1px)){.music-panel{background:rgba(10,22,40,0.8)}}
    .music-panel.no-backdrop-filter{background:rgba(10,22,40,0.8);backdrop-filter:none;-webkit-backdrop-filter:none}
    /* Music Panel text/icon contrast - ensures >= 4.5:1 ratio against glassmorphism background */
    .music-panel .mp-title{color:#ffffff}
    .music-panel .mp-artist{color:rgba(255,255,255,0.85)}
    .music-panel .mp-time-current,.music-panel .mp-time-total{color:rgba(255,255,255,0.7)}
    .music-panel .mp-controls button{color:#ffffff;border-color:rgba(255,255,255,0.2)}
    .music-panel .mp-controls button:hover{color:#ffffff;border-color:rgba(255,255,255,0.4)}
    .music-panel .mp-close{color:#ffffff;border-color:rgba(255,255,255,0.2)}
    .music-panel .mp-search-input{color:#ffffff}
    .music-panel .mp-search-input::placeholder{color:rgba(255,255,255,0.5)}
    .music-panel .mp-result-item .mp-result-title{color:#ffffff}
    .music-panel .mp-result-item .mp-result-artist{color:rgba(255,255,255,0.7)}

    /* Music Panel - Header */
    .mp-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px;border-bottom:1px solid rgba(0,229,255,0.08)}
    .mp-header-title{font-size:10px;letter-spacing:2px;color:rgba(255,255,255,0.6);text-transform:uppercase;font-weight:normal}
    .music-panel .mp-close{position:relative;top:auto;right:auto;background:none;border:1px solid rgba(255,255,255,0.15);color:#ffffff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;line-height:1}
    .music-panel .mp-close:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.3)}

    /* Music Panel - Now Playing Section */
    .mp-now-playing{display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
    .mp-album-art{width:48px;height:48px;border-radius:6px;object-fit:cover;background:rgba(0,229,255,0.05);border:1px solid rgba(0,229,255,0.08);flex-shrink:0}
    .mp-track-info{flex:1;min-width:0;overflow:hidden}
    .mp-track-info .mp-title{font-size:12px;font-weight:bold;letter-spacing:0.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mp-track-info .mp-artist{font-size:10px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* Music Panel - Playback Controls (compact row) */
    .music-panel .mp-controls{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 14px 12px}
    .music-panel .mp-controls button{background:none;border:1px solid rgba(255,255,255,0.15);color:#ffffff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
    .music-panel .mp-controls button:hover{background:rgba(0,229,255,0.08);border-color:rgba(0,229,255,0.3);color:#00e5ff}
    .music-panel .mp-controls .mp-play-pause{width:38px;height:38px;font-size:16px;border-color:rgba(0,229,255,0.2);color:#00e5ff}
    .music-panel .mp-controls .mp-play-pause:hover{background:rgba(0,229,255,0.12);border-color:rgba(0,229,255,0.4)}

    /* Music Panel - Progress Section */
    .mp-progress-section{padding:0 14px 12px}
    .mp-progress-section .mp-progress-bar{width:100%;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;cursor:pointer}
    .mp-progress-section .mp-progress-fill{height:100%;width:0%;background:rgba(0,229,255,0.85);border-radius:2px;transition:width 0.3s linear}
    .mp-progress-section .mp-time{display:flex;justify-content:space-between;margin-top:4px}
    .mp-progress-section .mp-time-current,.mp-progress-section .mp-time-total{font-size:9px;color:rgba(255,255,255,0.6);letter-spacing:0.5px}

    /* Music Panel - Search Section */
    .mp-search-section{position:relative;padding:0 14px 12px}
    .mp-search-section .mp-search-input{width:100%;padding:8px 12px;border-radius:20px;border:1px solid rgba(0,229,255,0.1);background:rgba(0,229,255,0.03);color:#ffffff;font-family:inherit;font-size:11px;outline:none;transition:border-color 0.2s}
    .mp-search-section .mp-search-input:focus{border-color:rgba(0,229,255,0.3)}
    .mp-search-section .mp-search-input::placeholder{color:rgba(255,255,255,0.5)}
    .mp-search-section .mp-suggestions{position:absolute;left:14px;right:14px;top:36px;max-height:200px;overflow-y:auto;background:rgba(10,22,40,0.95);border:1px solid rgba(0,229,255,0.12);border-radius:8px;margin-top:4px;z-index:10;box-shadow:0 4px 16px rgba(0,0,0,0.4)}
    .mp-search-section .mp-suggestions .mp-suggestion-item{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;transition:background 0.15s}
    .mp-search-section .mp-suggestions .mp-suggestion-item:hover,.mp-search-section .mp-suggestions .mp-suggestion-item.active{background:rgba(0,229,255,0.08)}
    .mp-search-section .mp-suggestions .mp-suggestion-item img{width:32px;height:32px;border-radius:4px;object-fit:cover}
    .mp-search-section .mp-suggestions .mp-suggestion-item .sg-title{font-size:11px;color:#ffffff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mp-search-section .mp-suggestions .mp-suggestion-item .sg-artist{font-size:9px;color:rgba(255,255,255,0.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mp-search-section .mp-search-results{max-height:150px;overflow-y:auto;margin-top:6px}
    .mp-search-section .mp-search-results::-webkit-scrollbar{width:3px}
    .mp-search-section .mp-search-results::-webkit-scrollbar-thumb{background:rgba(0,229,255,0.15);border-radius:2px}
    .mp-search-section .mp-search-results .mp-result-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;transition:background 0.15s}
    .mp-search-section .mp-search-results .mp-result-item:hover{background:rgba(0,229,255,0.06)}
    .mp-search-section .mp-search-results .mp-result-item img{width:36px;height:36px;border-radius:4px;object-fit:cover}
    .mp-search-section .mp-search-results .mp-result-item .mp-result-title{font-size:11px;color:#ffffff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mp-search-section .mp-search-results .mp-result-item .mp-result-artist{font-size:9px;color:rgba(255,255,255,0.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mp-search-section .mp-search-error{padding:8px;font-size:11px;color:rgba(255,60,60,0.8);text-align:center}

    /* Music Panel open/close animation classes */
    .music-panel.panel-hidden,.music-player.panel-hidden{transform:scale(0.95);opacity:0;pointer-events:none;transition:transform 250ms ease-in,opacity 250ms ease-in}
    .music-panel.panel-visible,.music-player.panel-visible{transform:scale(1);opacity:1;pointer-events:auto;transition:transform 300ms ease-out,opacity 300ms ease-out}

    /* Music Player - Now Playing Panel (legacy, pending DOM migration) */
    .music-player{position:fixed;bottom:0;left:0;right:0;z-index:150;background:rgba(10,22,40,.92);backdrop-filter:blur(20px);border-top-left-radius:16px;border-top-right-radius:16px;border-top:1px solid rgba(0,229,255,.1);box-shadow:0 -4px 30px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .3s ease;overflow:hidden}
    .music-player.hidden{transform:translateY(100%);opacity:0;pointer-events:none}
    .mp-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(40px) brightness(.3);opacity:.4;z-index:0;transition:background-image .5s ease}
    .mp-content{position:relative;z-index:1;padding:16px 20px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
    .mp-close{position:absolute;top:10px;right:14px;background:none;border:1px solid rgba(0,229,255,.12);color:rgba(0,229,255,.5);width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:2}
    .mp-close:hover{background:rgba(0,229,255,.08);color:#00e5ff;border-color:rgba(0,229,255,.3)}
    .mp-art{width:56px;height:56px;border-radius:8px;object-fit:cover;background:rgba(0,229,255,.05);border:1px solid rgba(0,229,255,.08);flex-shrink:0}
    .mp-info{flex:1;min-width:120px;overflow:hidden}
    .mp-title{font-size:13px;color:#e0f7ff;font-weight:bold;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mp-artist{font-size:11px;color:rgba(0,229,255,.5);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mp-progress{width:100%;display:flex;align-items:center;gap:8px;order:10}
    .mp-progress-track{flex:1;height:3px;background:rgba(0,229,255,.1);border-radius:2px;overflow:hidden;cursor:pointer;position:relative}
    .mp-progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#00e5ff,#7b2ff7);border-radius:2px;transition:width .3s linear}
    .mp-time-current,.mp-time-total{font-size:9px;color:rgba(0,229,255,.35);min-width:32px;letter-spacing:.5px}
    .mp-time-current{text-align:right}
    .mp-time-total{text-align:left}
    .mp-controls{display:flex;align-items:center;gap:10px}
    .mp-controls button{background:none;border:1px solid rgba(0,229,255,.1);color:rgba(0,229,255,.7);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s}
    .mp-controls button:hover{background:rgba(0,229,255,.08);color:#00e5ff;border-color:rgba(0,229,255,.3)}
    .mp-controls button.mp-play{width:38px;height:38px;font-size:16px;border-color:rgba(0,229,255,.2);color:#00e5ff}
    .mp-controls button.mp-play:hover{background:rgba(0,229,255,.12);border-color:rgba(0,229,255,.4)}
    .mp-search{width:100%;order:11;margin-top:6px;position:relative}
    .mp-search-input{width:100%;padding:8px 12px;border-radius:20px;border:1px solid rgba(0,229,255,.1);background:rgba(0,229,255,.03);color:#00e5ff;font-family:inherit;font-size:11px;outline:none;transition:border-color .2s}
    .mp-search-input:focus{border-color:rgba(0,229,255,.3)}
    .mp-search-input::placeholder{color:rgba(0,229,255,.2)}
    .mp-results{max-height:150px;overflow-y:auto;margin-top:6px;display:none}
    .mp-results.has-results{display:block}
    .mp-results::-webkit-scrollbar{width:3px}
    .mp-results::-webkit-scrollbar-thumb{background:rgba(0,229,255,.15);border-radius:2px}
    .mp-result-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;transition:background .15s}
    .mp-result-item:hover{background:rgba(0,229,255,.06)}
    .mp-result-item img{width:36px;height:36px;border-radius:4px;object-fit:cover}
    .mp-result-item .mp-result-title{font-size:11px;color:#b0e0e6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mp-result-item .mp-result-artist{font-size:9px;color:rgba(0,229,255,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* Mini indicator for background playback */
    .mp-mini{position:fixed;bottom:16px;right:16px;padding:6px 12px;border-radius:20px;background:rgba(10,22,40,.85);backdrop-filter:blur(10px);border:1px solid rgba(0,229,255,.15);color:rgba(0,229,255,.7);font-size:11px;cursor:pointer;z-index:120;display:flex;align-items:center;gap:6px;transition:all .2s}
    .mp-mini.hidden{display:none}
    .mp-mini:hover{background:rgba(0,229,255,.1);border-color:rgba(0,229,255,.3)}

    .mp-correction{padding:8px 12px;margin:6px 0;border-radius:6px;background:rgba(123,47,247,.06);border:1px solid rgba(123,47,247,.15);font-size:11px;color:rgba(123,47,247,.7);display:none}
    .mp-correction.visible{display:block}
    .mp-correction a{color:#7b2ff7;text-decoration:underline;cursor:pointer}
    .mp-source-badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:8px;letter-spacing:0.5px;text-transform:uppercase;margin-left:auto;flex-shrink:0}
    .mp-source-badge.youtube{background:rgba(255,0,0,.08);color:rgba(255,80,80,.7);border:1px solid rgba(255,0,0,.12)}
    .mp-source-badge.jiosaavn{background:rgba(0,200,83,.08);color:rgba(0,200,83,.7);border:1px solid rgba(0,200,83,.12)}
    .mp-source-badge.gaana{background:rgba(255,153,0,.08);color:rgba(255,153,0,.7);border:1px solid rgba(255,153,0,.12)}

    .mp-suggestions{position:absolute;left:0;right:0;top:100%;max-height:200px;overflow-y:auto;background:rgba(10,22,40,.95);border:1px solid rgba(0,229,255,.12);border-radius:8px;margin-top:4px;z-index:10;box-shadow:0 4px 16px rgba(0,0,0,.4)}
    .mp-suggestions .mp-suggestion-item{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;transition:background .15s}

  <script>
    // --- Universe Starfield + Orb Renderer ---
    const fxc=document.getElementById('fx'),fxctx=fxc.getContext('2d');
    let fw,fh;function fxResize(){fw=fxc.width=innerWidth;fh=fxc.height=innerHeight}addEventListener('resize',fxResize);fxResize();

    // Generate stars
    const stars=[];for(let i=0;i<300;i++)stars.push({x:Math.random()*2000-500,y:Math.random()*2000-500,s:Math.random()*1.5+0.3,a:Math.random()});
    function fxDraw(){
      fxctx.clearRect(0,0,fw,fh);
      // Stars
      for(const st of stars){
        st.a+=0.003;if(st.a>1)st.a=0;
        const alpha=Math.sin(st.a*Math.PI)*0.6+0.1;
        fxctx.beginPath();fxctx.arc(st.x%fw,st.y%fh,st.s,0,Math.PI*2);
        fxctx.fillStyle=`rgba(150,180,255,${alpha})`;fxctx.fill();
      }
      requestAnimationFrame(fxDraw)}fxDraw();

    // --- Orb Canvas Renderer (particle sphere like the reference image) ---
    const orbCvs=document.getElementById('orbCanvas');
    const octx=orbCvs.getContext('2d');
    let ow,oh;
    function orbResize(){
      const rect=orbCvs.parentElement.getBoundingClientRect();
      ow=orbCvs.width=rect.width*2;oh=orbCvs.height=rect.height*2;
      orbCvs.style.width=rect.width+'px';orbCvs.style.height=rect.height+'px';
    }
    orbResize();addEventListener('resize',orbResize);

    // Sphere points
    const POINTS=1800;const spherePoints=[];
    for(let i=0;i<POINTS;i++){
      const phi=Math.acos(1-2*(i+0.5)/POINTS);
      const theta=Math.PI*(1+Math.sqrt(5))*i;
      spherePoints.push({phi,theta,baseR:1});
    }
    // Dust cloud
    const dust=[];for(let i=0;i<200;i++)dust.push({a:Math.random()*Math.PI*2,r:0.55+Math.random()*0.35,s:Math.random()*1.5+0.5,speed:0.0005+Math.random()*0.001,phase:Math.random()*Math.PI*2});

    let orbPulse=1;let orbTargetPulse=1;let orbTime=0;let isSpeaking=false;let isListening=false;

    function drawOrb(){
      octx.clearRect(0,0,ow,oh);
      const cx=ow/2,cy=oh/2;
      const baseRadius=Math.min(ow,oh)*0.28;
      orbPulse+=(orbTargetPulse-orbPulse)*0.15;
      const radius=baseRadius*orbPulse;
      orbTime+=0.008;

      // Determine color based on state
      let r=0,g=180,b=255; // blue
      if(isListening){r=0;g=255;b=136;} // green

      // Glow background
      const glowGrad=octx.createRadialGradient(cx,cy,radius*0.3,cx,cy,radius*1.8);
      glowGrad.addColorStop(0,`rgba(${r},${g},${b},0.15)`);
      glowGrad.addColorStop(0.5,`rgba(${r},${g},${b},0.04)`);
      glowGrad.addColorStop(1,'transparent');
      octx.fillStyle=glowGrad;octx.fillRect(0,0,ow,oh);

      // Draw sphere points
      const rotY=orbTime*0.4;const rotX=orbTime*0.2;
      const cosY=Math.cos(rotY),sinY=Math.sin(rotY),cosX=Math.cos(rotX),sinX=Math.sin(rotX);

      for(const p of spherePoints){
        const x0=Math.sin(p.phi)*Math.cos(p.theta);
        const y0=Math.cos(p.phi);
        const z0=Math.sin(p.phi)*Math.sin(p.theta);

        // Rotate Y
        const x1=x0*cosY-z0*sinY;const z1=x0*sinY+z0*cosY;
        // Rotate X
        const y1=y0*cosX-z1*sinX;const z2=y0*sinX+z1*cosX;

        // Surface distortion (organic pulsating)
        const distort=1+0.06*Math.sin(p.phi*8+orbTime*3)*Math.cos(p.theta*6+orbTime*2);
        const pr=radius*distort;

        const px=cx+x1*pr;const py=cy+y1*pr;
        const depth=(z2+1)/2; // 0=back, 1=front

        if(depth<0.2)continue; // cull back-facing

        const alpha=depth*0.8;
        const size=0.8+depth*1.8;

        // Brighter at front, energy flow effect
        const energy=Math.sin(p.phi*4+p.theta*3+orbTime*5)*0.5+0.5;
        const bright=Math.floor(100+energy*155);

        octx.beginPath();octx.arc(px,py,size,0,Math.PI*2);
        octx.fillStyle=`rgba(${Math.floor(r*0.3+bright*0.1)},${Math.floor(g*0.6+bright*0.4)},${Math.floor(b*0.5+bright*0.5)},${alpha.toFixed(2)})`;
        octx.fill();
      }

      // Inner core glow
      const coreGrad=octx.createRadialGradient(cx,cy,0,cx,cy,radius*0.5);
      coreGrad.addColorStop(0,`rgba(${r+100>255?255:r+100},${g+50>255?255:g+50},${b},0.3)`);
      coreGrad.addColorStop(1,'transparent');
      octx.fillStyle=coreGrad;octx.beginPath();octx.arc(cx,cy,radius*0.5,0,Math.PI*2);octx.fill();

      // Fiery energy rays — shoot outward, glow with phase
      const rayCount = 16;
      for (let i = 0; i < rayCount; i++) {
        const angle = (i / rayCount) * Math.PI * 2 + orbTime * 0.3;
        const rayLen = radius * (0.6 + 0.5 * Math.sin(angle * 3 + orbTime * 4) * orbPulse);
        const rayWidth = 1.5 + Math.sin(angle * 2 + orbTime * 5) * 1;
        const intensity = 0.3 + 0.5 * Math.sin(i * 1.7 + orbTime * 3);

        const x1 = cx + Math.cos(angle) * radius * 0.9;
        const y1 = cy + Math.sin(angle) * radius * 0.9;
        const x2 = cx + Math.cos(angle) * (radius + rayLen);
        const y2 = cy + Math.sin(angle) * (radius + rayLen);

        const rayGrad = octx.createLinearGradient(x1, y1, x2, y2);
        rayGrad.addColorStop(0, `rgba(${r + 80 > 255 ? 255 : r + 80},${g},${b},${(intensity * 0.8).toFixed(2)})`);
        rayGrad.addColorStop(0.4, `rgba(${r},${g},${b},${(intensity * 0.5).toFixed(2)})`);
        rayGrad.addColorStop(1, 'transparent');

        octx.beginPath();
        octx.moveTo(x1, y1);
        octx.lineTo(x2, y2);
        octx.strokeStyle = rayGrad;
        octx.lineWidth = rayWidth;
        octx.shadowColor = `rgba(${r},${g},${b},0.6)`;
        octx.shadowBlur = 8;
        octx.stroke();
        octx.shadowBlur = 0;
      }

      // Secondary fiery glow halo around the orb
      const haloGrad = octx.createRadialGradient(cx, cy, radius * 0.85, cx, cy, radius * 1.3);
      haloGrad.addColorStop(0, `rgba(${r},${g},${b},${(0.1 + 0.1 * orbPulse).toFixed(2)})`);
      haloGrad.addColorStop(0.5, `rgba(${r},${g},${b},${(0.04 * orbPulse).toFixed(2)})`);
      haloGrad.addColorStop(1, 'transparent');
      octx.fillStyle = haloGrad;
      octx.beginPath(); octx.arc(cx, cy, radius * 1.3, 0, Math.PI * 2); octx.fill();

        octx.fillStyle=`rgba(${r*0.5},${g*0.6},${b},${0.15+Math.sin(d.phase+orbTime)*0.1})`;
        octx.fill();
      }

      requestAnimationFrame(drawOrb);
    }

    function speak(t){if(!speechSynthesis)return;speechSynthesis.cancel();

      u.onboundary = () => { orbTargetPulse = 1 + (Math.random() * 0.12 + 0.06); setTimeout(() => { orbTargetPulse = 1; }, 120); };

      u.onend=()=>{

  <script>
    // --- MusicPlayer Class ---
    class MusicPlayer {
      constructor() {
        this.queue = [];
        this.currentIndex = -1;
        this.ytPlayer = null;
        this.isPlaying = false;
        this.visible = false;
        this._currentVideoId = null;
        this.progressInterval = null;
      }

      // Load a single track into the player
      loadTrack(track) {
        this.queue = [track];
        this.currentIndex = 0;
        this._currentVideoId = null;
        this.updateNowPlaying(track);
        if (this.ytPlayer) {
          this.play();
        }
        this.updateControlsUI();
      }

      // Load multiple tracks, play from startIndex
      loadQueue(tracks, startIndex) {
        this.queue = [...tracks];
        this.currentIndex = startIndex;
        this._currentVideoId = null;
        this.updateNowPlaying(this.getCurrentTrack());
        if (this.ytPlayer) {
          this.play();
        }
        this.updateControlsUI();
      }

      // Start playback
      play() {
        if (this.ytPlayer && this.getCurrentTrack()) {
          const track = this.getCurrentTrack();
          // If the video is different from what's currently loaded, load the new one
          if (this._currentVideoId !== track.video_id) {
            this.ytPlayer.loadVideoById(track.video_id);
            this._currentVideoId = track.video_id;
          } else {
            this.ytPlayer.playVideo();
          }
          this.updateNowPlaying(track);
        }
        this.isPlaying = true;
        this.startProgressInterval();
        this.updateControlsUI();
        // Show mini indicator if panel is hidden
        this._updateMiniIndicator();
      }

      // Pause playback
      pause() {
        if (this.ytPlayer) {
          this.ytPlayer.pauseVideo();
        }
        this.isPlaying = false;
        this.stopProgressInterval();
        this.updateControlsUI();
        // Hide mini indicator when paused
        this._updateMiniIndicator();
      }

      // Toggle between play and pause
      togglePlayPause() {
        if (this.isPlaying) {
          this.pause();
        } else {
          this.play();
        }
      }

      // Advance to the next track in queue
      next() {
        if (this.currentIndex < this.queue.length - 1) {
          this.currentIndex++;
          this._currentVideoId = null;
          if (this.ytPlayer) {
            this.play();
          }
          this.updateNowPlaying(this.getCurrentTrack());
        }
        this.updateControlsUI();
      }

      // Go back to the previous track in queue
      previous() {
        if (this.currentIndex > 0) {
          this.currentIndex--;
          this._currentVideoId = null;
          if (this.ytPlayer) {
            this.play();
          }
          this.updateNowPlaying(this.getCurrentTrack());
        }
        this.updateControlsUI();
      }

      // Clear the queue and reset index
      clearQueue() {
        this.queue = [];
        this.currentIndex = -1;
        this.stopProgressInterval();
      }

      // Append tracks to the end of the queue
      addToQueue(tracks) {
        this.queue.push(...tracks);
      }

      // Get the current track or null if none
      getCurrentTrack() {
        if (this.currentIndex >= 0 && this.currentIndex < this.queue.length) {
          return this.queue[this.currentIndex];
        }
        return null;
      }

      // Format seconds into time display string
      // Returns "m:ss" for < 3600 seconds, "h:mm:ss" for >= 3600 seconds
      formatTime(seconds) {
        if (!seconds || seconds < 0 || !isFinite(seconds)) return '0:00';
        const totalSeconds = Math.floor(seconds);
        if (totalSeconds >= 3600) {
          const hours = Math.floor(totalSeconds / 3600);
          const mins = Math.floor((totalSeconds % 3600) / 60);
          const secs = totalSeconds % 60;
          return hours + ':' + (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
        }
        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        return mins + ':' + (secs < 10 ? '0' : '') + secs;
      }

      // Start polling the YouTube player for progress updates
      startProgressInterval() {
        this.stopProgressInterval();
        this.progressInterval = setInterval(() => {
          if (!this.ytPlayer || typeof this.ytPlayer.getCurrentTime !== 'function' || typeof this.ytPlayer.getDuration !== 'function') {
            return;
          }
          const currentTime = this.ytPlayer.getCurrentTime();
          const duration = this.ytPlayer.getDuration();

          // Guard against division by zero
          let progress = 0;
          if (duration > 0) {
            progress = currentTime / duration;
          }

          // Update progress bar width in legacy panel (safely check for element existence)
          const progressBar = document.querySelector('.mp-progress-bar');
          if (progressBar) {
            progressBar.style.width = (progress * 100) + '%';
          }

          // Update progress fill in the new compact music-panel
          const progressFill = document.querySelector('.mp-progress-section .mp-progress-fill');
          if (progressFill) {
            progressFill.style.width = (progress * 100) + '%';
          }

          // Update current time display (both legacy and new panel)
          const timeCurrent = document.querySelectorAll('.mp-time-current');
          timeCurrent.forEach(el => {
            el.textContent = this.formatTime(currentTime);
          });

          // Update total duration display (both legacy and new panel)
          const timeTotal = document.querySelectorAll('.mp-time-total');
          timeTotal.forEach(el => {
            el.textContent = this.formatTime(duration);
          });
        }, 1000);
      }

      // Stop the progress polling interval
      stopProgressInterval() {
        if (this.progressInterval) {
          clearInterval(this.progressInterval);
          this.progressInterval = null;
        }
      }

      // UI methods
      show() {
        this.visible = true;
        // Use PanelManager to show the new music panel
        if (window.panelManager && typeof window.panelManager.show === 'function') {
          window.panelManager.show();
        }
        // Hide the mini indicator when panel is open
        const mini = document.getElementById('mp-mini-indicator');
        if (mini) mini.classList.add('hidden');
        // Reset toggle button to idle when panel is visible
        this._updateTogglePlayingState();
      }

      hide() {
        this.visible = false;
        // Use PanelManager to hide the new music panel
        if (window.panelManager && typeof window.panelManager.hide === 'function') {
          window.panelManager.hide();
        }
        // Show mini indicator if music is still playing
        this._updateMiniIndicator();
      }

      updateNowPlaying(track) {
        if (!track) return;

        // Update the NEW music-panel elements
        const panel = document.querySelector('.music-panel');
        if (panel) {
          const albumArt = panel.querySelector('.mp-album-art');
          if (albumArt) albumArt.src = track.thumbnail_url || '';

          const titleEl = panel.querySelector('.mp-track-info .mp-title');
          if (titleEl) titleEl.textContent = track.title || '';

          const artistEl = panel.querySelector('.mp-track-info .mp-artist');
          if (artistEl) artistEl.textContent = track.artist || '';
        }

        // Also update legacy panel elements (for any remaining references)
        const art = document.querySelector('#music-player .mp-art');
        if (art) art.src = track.thumbnail_url;

        const legacyTitle = document.querySelector('#music-player .mp-title');
        if (legacyTitle) legacyTitle.textContent = track.title;

        const legacyArtist = document.querySelector('#music-player .mp-artist');
        if (legacyArtist) legacyArtist.textContent = track.artist;

        const bg = document.querySelector('.mp-bg');
        if (bg) bg.style.backgroundImage = 'url(' + track.thumbnail_url + ')';

        // Show the panel when track is loaded
        this.show();
      }

      updateProgress() {}
      render() {}

      // Update mini indicator visibility based on play state and panel visibility
      _updateMiniIndicator() {
        const mini = document.getElementById('mp-mini-indicator');
        if (!mini) return;
        if (!this.visible && this.isPlaying) {
          // Show mini indicator with current track title
          const track = this.getCurrentTrack();
          const titleEl = mini.querySelector('.mp-mini-title');
          if (titleEl) {
            titleEl.textContent = track ? track.title : 'Playing';
          }
          mini.classList.remove('hidden');
        } else {
          mini.classList.add('hidden');
        }
        // Update toggle button playing indicator
        this._updateTogglePlayingState();
      }

      // Update toggle button playing state: pulse when playing and panel is hidden
      _updateTogglePlayingState() {
        if (window.musicToggleButton && typeof window.musicToggleButton.setState === 'function') {
          if (!this.visible && this.isPlaying) {
            window.musicToggleButton.setState('playing');
          } else if (window.musicToggleButton.state !== 'disabled') {
            window.musicToggleButton.setState('idle');
          }
        }
      }

      // --- Search Interface ---

      // Validate search input: returns false if query.length > 200
      validateSearchInput(query) {
        if (query.length > 200) return false;
        return true;
      }

      // Clear suggestions: hides and empties the .mp-suggestions container within .music-panel
      clearSuggestions() {
        const panel = document.querySelector('.music-panel');
        if (!panel) return;
        const suggestionsEl = panel.querySelector('.mp-suggestions');
        if (suggestionsEl) {
          suggestionsEl.style.display = 'none';
          suggestionsEl.innerHTML = '';
        }
      }

      // Initialize search input and event listeners (binds to .mp-search-input within .music-panel)
      initSearch() {
        const panel = document.querySelector('.music-panel');
        if (!panel) return;
        const searchInput = panel.querySelector('.mp-search-input');
        if (!searchInput) return;

        let debounceTimer = null;
        let acController = null;
        let acActiveIndex = -1;

        // Submit on Enter key
        searchInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const query = searchInput.value.trim();
            if (query && this.validateSearchInput(query)) {
              this.search(query);
            }
          }
          // Keyboard navigation for suggestions
          const suggestionsEl = panel.querySelector('.mp-suggestions');
          if (suggestionsEl && suggestionsEl.style.display !== 'none') {
            const items = suggestionsEl.querySelectorAll('.mp-suggestion-item');
            if (items.length) {
              if (e.key === 'ArrowDown') {
                e.preventDefault();
                acActiveIndex = Math.min(acActiveIndex + 1, items.length - 1);
                items.forEach((item, i) => item.classList.toggle('active', i === acActiveIndex));
                if (acActiveIndex >= 0) items[acActiveIndex].scrollIntoView({block: 'nearest'});
              } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                acActiveIndex = Math.max(acActiveIndex - 1, -1);
                items.forEach((item, i) => item.classList.toggle('active', i === acActiveIndex));
                if (acActiveIndex >= 0) items[acActiveIndex].scrollIntoView({block: 'nearest'});
              } else if (e.key === 'Enter' && acActiveIndex >= 0) {
                e.preventDefault();
                items[acActiveIndex].click();
              } else if (e.key === 'Escape') {
                this.clearSuggestions();
              }
            }
          }
        });

        // Debounced autocomplete on input event
        searchInput.addEventListener('input', () => {
          clearTimeout(debounceTimer);
          const query = searchInput.value.trim();

          // Validate input length
          if (!this.validateSearchInput(searchInput.value)) {
            // Truncate to 200 characters
            searchInput.value = searchInput.value.slice(0, 200);
          }

          // Clear suggestions if below 2 characters
          if (query.length < 2) {
            this.clearSuggestions();
            return;
          }

          // Debounce 250ms then call autocomplete
          debounceTimer = setTimeout(() => {
            // Cancel previous autocomplete request
            if (acController) acController.abort();
            acController = new AbortController();

            fetch('/music/autocomplete?q=' + encodeURIComponent(query), {
              signal: acController.signal,
              headers: {'Authorization': 'Bearer ' + (window.jt || '')}
            })
            .then(resp => resp.json())
            .then(data => {
              const suggestions = data.suggestions || [];
              acActiveIndex = -1;
              this.displaySuggestions(suggestions);
            })
            .catch(err => {
              if (err.name !== 'AbortError') {
                // Silently handle errors for autocomplete
                console.warn('Autocomplete error:', err);
              }
            });
          }, 250);
        });

        // Dismiss correction banner on new input
        searchInput.addEventListener('input', () => {
          const correctionBanner = panel.querySelector('.mp-correction');
          if (correctionBanner) correctionBanner.classList.remove('visible');
        });

        // Hide suggestions when clicking outside
        document.addEventListener('click', (e) => {
          const suggestionsEl = panel.querySelector('.mp-suggestions');
          if (suggestionsEl && !suggestionsEl.contains(e.target) && e.target !== searchInput) {
            this.clearSuggestions();
          }
        });
      }

      // Perform search against backend
      async search(query) {
        const panel = document.querySelector('.music-panel');
        if (!panel) return;
        const resultsEl = panel.querySelector('.mp-search-results');
        const errorEl = panel.querySelector('.mp-search-error');
        if (!resultsEl || !errorEl) return;

        // Dismiss correction banner on new search
        const correctionBanner = panel.querySelector('.mp-correction');
        if (correctionBanner) correctionBanner.classList.remove('visible');

        // Show loading state: show results area, hide error
        errorEl.style.display = 'none';
        errorEl.textContent = '';
        resultsEl.style.display = 'block';
        resultsEl.innerHTML = '<div style="padding:8px;font-size:11px;color:rgba(0,229,255,.4)">Searching...</div>';

        // Set up AbortController with 5-second timeout
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);

        try {
          const response = await fetch('/music/search?q=' + encodeURIComponent(query), {
            signal: controller.signal,
            headers: { 'Authorization': 'Bearer ' + (window.jt || '') }
          });
          clearTimeout(timeoutId);

          if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error || 'Search request failed');
          }

          const data = await response.json();

          // Show/hide correction banner
          if (correctionBanner) {
            if (data.correction) {
              correctionBanner.innerHTML = 'Did you mean: <a class="mp-correction-link">' + data.correction + '</a>?';
              correctionBanner.classList.add('visible');
              const self = this;
              correctionBanner.querySelector('.mp-correction-link').addEventListener('click', function() {
                const searchInput = panel.querySelector('.mp-search-input');
                if (searchInput) searchInput.value = data.correction;
                correctionBanner.classList.remove('visible');
                self.search(data.correction);
              });
            } else {
              correctionBanner.classList.remove('visible');
            }
          }

          if (data.results && data.results.length > 0) {
            // Show results, hide error
            errorEl.style.display = 'none';
            errorEl.textContent = '';
            resultsEl.style.display = 'block';
            this.displayResults(data.results);
          } else {
            // No results found — show error, hide results
            resultsEl.style.display = 'none';
            resultsEl.innerHTML = '';
            errorEl.textContent = 'No results found';
            errorEl.style.display = 'block';
          }
        } catch (err) {
          clearTimeout(timeoutId);
          // Hide results, show error
          resultsEl.style.display = 'none';
          resultsEl.innerHTML = '';
          if (err.name === 'AbortError') {
            // Timeout (5-second) or aborted request
            errorEl.textContent = 'Search temporarily unavailable';
          } else {
            // Network error or other fetch rejection
            errorEl.textContent = 'Search temporarily unavailable';
          }
          errorEl.style.display = 'block';
        }
      }

      // Render search results in the new panel's .mp-search-results container
      // Capped at 20 items max per Requirement 5.4
      displayResults(results) {
        const panel = document.querySelector('.music-panel');
        if (!panel) return;
        const resultsEl = panel.querySelector('.mp-search-results');
        if (!resultsEl) return;

        // Clear existing content and show the container
        resultsEl.innerHTML = '';
        resultsEl.style.display = 'block';

        // Cap at 20 results max (Requirement 5.4, Property 6)
        const capped = results.slice(0, 20);

        capped.forEach((track, index) => {
          const item = document.createElement('div');
          item.className = 'mp-result-item';

          const img = document.createElement('img');
          img.src = track.thumbnail_url || '';
          img.alt = track.title || '';

          const infoDiv = document.createElement('div');
          infoDiv.style.cssText = 'overflow:hidden;flex:1;min-width:0';

          const titleDiv = document.createElement('div');
          titleDiv.className = 'mp-result-title';
          titleDiv.textContent = track.title || '';

          const artistDiv = document.createElement('div');
          artistDiv.className = 'mp-result-artist';
          artistDiv.textContent = track.artist || '';

          infoDiv.appendChild(titleDiv);
          infoDiv.appendChild(artistDiv);
          item.appendChild(img);
          item.appendChild(infoDiv);

          // Source badge
          const sourceName = (track.source || 'youtube').toLowerCase();
          const badge = document.createElement('span');
          badge.className = 'mp-source-badge ' + sourceName;
          badge.textContent = sourceName;
          item.appendChild(badge);

          // On click, show loading indicator then initiate playback (Requirement 5.3)
          item.addEventListener('click', () => {
            // Show loading indicator on the clicked item
            item.style.opacity = '0.6';
            item.style.pointerEvents = 'none';
            const loadingSpan = document.createElement('span');
            loadingSpan.className = 'mp-result-loading';
            loadingSpan.textContent = 'Loading...';
            loadingSpan.style.cssText = 'font-size:9px;color:rgba(0,229,255,0.7);margin-left:auto;flex-shrink:0';
            item.appendChild(loadingSpan);

            // Load the track (initiates playback)
            this.loadTrack(track);
          });

          resultsEl.appendChild(item);
        });
      }

      // Display autocomplete suggestions in the .mp-suggestions container within .music-panel
      // Capped at 8 items max per Requirement 5.2
      displaySuggestions(suggestions) {
        const panel = document.querySelector('.music-panel');
        if (!panel) return;
        const suggestionsEl = panel.querySelector('.mp-suggestions');
        if (!suggestionsEl) return;

        if (!suggestions || suggestions.length === 0) {
          suggestionsEl.innerHTML = '';
          suggestionsEl.style.display = 'none';
          return;
        }

        // Cap at 8 suggestions max (Requirement 5.2, Property 5)
        const capped = suggestions.slice(0, 8);

        suggestionsEl.innerHTML = capped.map(s => {
          return '<div class="mp-suggestion-item" data-videoid="' + (s.video_id || '') + '" data-source="' + (s.source || '') + '" data-title="' + (s.title || '').replace(/"/g, '&quot;') + '" data-artist="' + (s.artist || '').replace(/"/g, '&quot;') + '" data-thumb="' + (s.thumbnail_url || '') + '">' +
            '<img src="' + (s.thumbnail_url || '') + '" alt="" />' +
            '<div>' +
              '<div class="sg-title">' + (s.title || '') + '</div>' +
              '<div class="sg-artist">' + (s.artist || '') + '</div>' +
            '</div>' +
          '</div>';
        }).join('');

        suggestionsEl.style.display = 'block';

        // Click handler for each suggestion
        const self = this;
        suggestionsEl.querySelectorAll('.mp-suggestion-item').forEach(item => {
          item.addEventListener('click', () => {
            const track = {
              video_id: item.dataset.videoid,
              title: item.dataset.title,
              artist: item.dataset.artist,
              thumbnail_url: item.dataset.thumb,
              source: item.dataset.source
            };
            self.clearSuggestions();
            const searchInput = panel.querySelector('.mp-search-input');
            if (searchInput) searchInput.value = track.title;
            self.loadTrack(track);
          });
        });
      }

      // Initialize the YouTube IFrame Player
      initYTPlayer() {
        this.ytApiLoaded = true; // Mark as successfully loaded
        this.ytPlayer = new YT.Player('yt-player-container', {
          height: '0',
          width: '0',
          playerVars: {
            autoplay: 0,
            controls: 0,
            showinfo: 0,
            modestbranding: 1,
            rel: 0
          },
          events: {
            onStateChange: (event) => this._onStateChange(event),
            onError: (event) => this._onError(event)
          }
        });
      }

      // Handle YouTube player state changes
      _onStateChange(event) {
        switch (event.data) {
          case YT.PlayerState.ENDED:
            this.stopProgressInterval();
            // Auto-advance to the next track
            if (this.currentIndex < this.queue.length - 1) {
              this.next();
            } else {
              // No more tracks in queue
              this.isPlaying = false;
              this._currentVideoId = null;
              this.updateNowPlaying();
              this._updateMiniIndicator();
            }
            break;
          case YT.PlayerState.PLAYING:
            this.isPlaying = true;
            this.startProgressInterval();
            this._updateMiniIndicator();
            break;
          case YT.PlayerState.PAUSED:
            this.isPlaying = false;
            this.stopProgressInterval();
            this._updateMiniIndicator();
            break;
        }
        this.updateControlsUI();
      }

      // Handle YouTube player errors (skip unavailable tracks)
      _onError(event) {
        console.error('YouTube Player Error:', event.data);
        this.stopProgressInterval();
        this._showToast('Track unavailable, skipping...');
        // Skip to next track if available
        if (this.currentIndex < this.queue.length - 1) {
          this.next();
        } else {
          this.isPlaying = false;
          this._currentVideoId = null;
        }
      }

      // Show a brief toast notification
      _showToast(message) {
        const toast = document.createElement('div');
        toast.textContent = message;
        toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:8px;background:rgba(255,60,60,.85);color:#fff;font-size:12px;font-family:inherit;z-index:10000;pointer-events:none;opacity:1;transition:opacity .5s';
        document.body.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; }, 2500);
        setTimeout(() => { toast.remove(); }, 3000);
      }

      // Initialize playback control button event listeners
      initControls() {
        // --- Wire the NEW music-panel controls ---
        const panel = document.querySelector('.music-panel');
        if (panel) {
          const playPauseBtn = panel.querySelector('.mp-play-pause');
          const nextBtn = panel.querySelector('.mp-next');
          const prevBtn = panel.querySelector('.mp-prev');
          const closeBtn = panel.querySelector('.mp-close');

          if (playPauseBtn) {
            playPauseBtn.addEventListener('click', () => this.togglePlayPause());
          }
          if (nextBtn) {
            nextBtn.addEventListener('click', () => this.next());
          }
          if (prevBtn) {
            prevBtn.addEventListener('click', () => this.previous());
          }
          if (closeBtn) {
            closeBtn.addEventListener('click', () => {
              if (window.panelManager && typeof window.panelManager.hide === 'function') {
                window.panelManager.hide();
              }
              this.visible = false;
              this._updateMiniIndicator();
            });
          }
        }

        // --- Wire legacy panel controls (for backward compatibility) ---
        const legacyPanel = document.getElementById('music-player');
        if (legacyPanel) {
          const legacyPlayBtn = legacyPanel.querySelector('.mp-play');
          const legacyNextBtn = legacyPanel.querySelector('.mp-next');
          const legacyPrevBtn = legacyPanel.querySelector('.mp-prev');
          const legacyCloseBtn = legacyPanel.querySelector('.mp-close');

          if (legacyPlayBtn) {
            legacyPlayBtn.addEventListener('click', () => this.togglePlayPause());
          }
          if (legacyNextBtn) {
            legacyNextBtn.addEventListener('click', () => this.next());
          }
          if (legacyPrevBtn) {
            legacyPrevBtn.addEventListener('click', () => this.previous());
          }
          if (legacyCloseBtn) {
            legacyCloseBtn.addEventListener('click', () => this.hide());
          }
        }

        // Wire mini indicator click to show panel
        const miniIndicator = document.getElementById('mp-mini-indicator');
        if (miniIndicator) {
          miniIndicator.addEventListener('click', () => this.show());
        }

        // Set initial button states
        this.updateControlsUI();
      }

      // Update control button icons and enabled/disabled states
      updateControlsUI() {
        // --- Update NEW music-panel controls ---
        const panel = document.querySelector('.music-panel');
        if (panel) {
          const playPauseBtn = panel.querySelector('.mp-play-pause');
          const nextBtn = panel.querySelector('.mp-next');
          const prevBtn = panel.querySelector('.mp-prev');

          if (playPauseBtn) {
            playPauseBtn.textContent = this.isPlaying ? '⏸' : '▶';
            playPauseBtn.setAttribute('aria-label', this.isPlaying ? 'Pause' : 'Play');
          }

          if (nextBtn) {
            const atEnd = this.currentIndex >= this.queue.length - 1;
            nextBtn.disabled = atEnd;
            nextBtn.style.opacity = atEnd ? '0.3' : '1';
            nextBtn.style.pointerEvents = atEnd ? 'none' : 'auto';
          }

          if (prevBtn) {
            const atStart = this.currentIndex <= 0;
            prevBtn.disabled = atStart;
            prevBtn.style.opacity = atStart ? '0.3' : '1';
            prevBtn.style.pointerEvents = atStart ? 'none' : 'auto';
          }
        }

        // --- Update legacy panel controls ---
        const legacyPanel = document.getElementById('music-player');
        if (legacyPanel) {
          const playBtn = legacyPanel.querySelector('.mp-play');
          const nextBtn = legacyPanel.querySelector('.mp-next');
          const prevBtn = legacyPanel.querySelector('.mp-prev');

          if (playBtn) {
            playBtn.textContent = this.isPlaying ? '⏸' : '▶';
            playBtn.setAttribute('aria-label', this.isPlaying ? 'Pause' : 'Play');
          }

          if (nextBtn) {
            const atEnd = this.currentIndex >= this.queue.length - 1;
            nextBtn.disabled = atEnd;
            nextBtn.style.opacity = atEnd ? '0.3' : '1';
            nextBtn.style.pointerEvents = atEnd ? 'none' : 'auto';
          }

          if (prevBtn) {
            const atStart = this.currentIndex <= 0;
            prevBtn.disabled = atStart;
            prevBtn.style.opacity = atStart ? '0.3' : '1';
            prevBtn.style.pointerEvents = atStart ? 'none' : 'auto';
          }
        }
      }
    }

    // Instantiate global music player
    window.musicPlayer = new MusicPlayer();
    window.musicPlayer.initControls();

    // Initialize search interface
    window.musicPlayer.initSearch();

    // --- YouTube IFrame API Integration ---

    // Dynamically load the YouTube IFrame API script
    function loadYouTubeAPI() {
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
    }

    // Global callback required by YouTube IFrame API
    function onYouTubeIframeAPIReady() {
      window.musicPlayer.initYTPlayer();
    }

    // Load the YouTube API after MusicPlayer is instantiated
    window.musicPlayer.ytApiLoaded = null; // pending
    loadYouTubeAPI();

    // Timeout: if YouTube IFrame API hasn't loaded within 10 seconds, mark as failed
    setTimeout(() => {
      if (window.musicPlayer.ytApiLoaded === null) {
        window.musicPlayer.ytApiLoaded = false;
        console.warn('YouTube IFrame API failed to load within timeout');
      }
    }, 10000);

    // === Autocomplete (Legacy Panel) ===
    (function() {
      let acTimer = null;  // debounce timer
      let acController = null;  // AbortController for cancellation
      let acActiveIndex = -1;  // keyboard navigation index

      // Only bind to the legacy panel's search input (not the new .music-panel one)
      const legacyPanel = document.getElementById('music-player');
      if (!legacyPanel) return;
      const searchInput = legacyPanel.querySelector('.mp-search-input');
      const suggestionsPanel = legacyPanel.querySelector('.mp-suggestions');
      const offlineBanner = legacyPanel.querySelector('.mp-offline-banner');
      const retryBtn = legacyPanel.querySelector('.mp-retry-btn');

      if (!searchInput || !suggestionsPanel) return;

      // --- LRU Cache (50 entries, 5-min TTL) ---
      class AcCache {
        constructor(maxSize, ttlMs) {
          this.maxSize = maxSize || 50;
          this.ttlMs = ttlMs || 5 * 60 * 1000;
          this.cache = new Map();
        }
        get(key) {
          const entry = this.cache.get(key);
          if (!entry) return null;
          if (Date.now() - entry.ts > this.ttlMs) {
            this.cache.delete(key);
            return null;
          }
          // Move to end (MRU)
          this.cache.delete(key);
          this.cache.set(key, entry);
          return entry.data;
        }
        set(key, data) {
          if (this.cache.has(key)) this.cache.delete(key);
          this.cache.set(key, { data: data, ts: Date.now() });
          // Evict oldest if over capacity
          while (this.cache.size > this.maxSize) {
            var firstKey = this.cache.keys().next().value;
            this.cache.delete(firstKey);
          }
        }
      }

      var acCache = new AcCache(50, 5 * 60 * 1000);

      // --- Offline handling ---
      var retryCount = 0;
      var retryTimer = null;

      function handleOfflineError() {
        if (retryCount < 3) {
          retryCount++;
          retryTimer = setTimeout(function() {
            var query = searchInput.value.trim();
            if (query.length >= 2) fetchSuggestions(query);
          }, 5000);
        } else {
          // Show persistent error with manual retry
          if (offlineBanner) offlineBanner.classList.add('visible');
        }
      }

      if (retryBtn) {
        retryBtn.addEventListener('click', function() {
          retryCount = 0;
          if (offlineBanner) offlineBanner.classList.remove('visible');
          var query = searchInput.value.trim();
          if (query.length >= 2) fetchSuggestions(query);
        });
      }

      // Debounce handler on input
      searchInput.addEventListener('input', function() {
        clearTimeout(acTimer);
        clearTimeout(retryTimer);
        retryCount = 0;
        if (offlineBanner) offlineBanner.classList.remove('visible');

        var query = this.value.trim();

        if (query.length < 2) {
          hideSuggestions();
          return;
        }

        acTimer = setTimeout(function() { fetchSuggestions(query); }, 250);
      });

      // Keyboard navigation
      searchInput.addEventListener('keydown', function(e) {
        var items = suggestionsPanel.querySelectorAll('.mp-suggestion-item');
        if (!items.length) return;

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          acActiveIndex = Math.min(acActiveIndex + 1, items.length - 1);
          updateActiveItem(items);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          acActiveIndex = Math.max(acActiveIndex - 1, -1);
          updateActiveItem(items);
        } else if (e.key === 'Enter' && acActiveIndex >= 0) {
          e.preventDefault();
          items[acActiveIndex].click();
        } else if (e.key === 'Escape') {
          hideSuggestions();
        }
      });

      function updateActiveItem(items) {
        items.forEach(function(item, i) { item.classList.toggle('active', i === acActiveIndex); });
        if (acActiveIndex >= 0) items[acActiveIndex].scrollIntoView({block: 'nearest'});
      }

      function fetchSuggestions(query) {
        // Check cache first
        var cached = acCache.get(query.toLowerCase());
        if (cached) {
          renderSuggestions(cached);
          return;
        }

        // Cancel previous request
        if (acController) acController.abort();
        acController = new AbortController();

        // Show loading spinner
        searchInput.classList.add('loading');

        fetch('/music/autocomplete?q=' + encodeURIComponent(query), {
          signal: acController.signal,
          headers: {'Authorization': 'Bearer ' + (window.jt || '')}
        }).then(function(resp) {
          return resp.json();
        }).then(function(data) {
          var suggestions = data.suggestions || [];
          // Cache the result
          acCache.set(query.toLowerCase(), suggestions);
          renderSuggestions(suggestions);
          // Reset retry count on success
          retryCount = 0;
          if (offlineBanner) offlineBanner.classList.remove('visible');
        }).catch(function(err) {
          if (err.name !== 'AbortError') {
            handleOfflineError();
          }
        }).finally(function() {
          searchInput.classList.remove('loading');
        });
      }

      function renderSuggestions(suggestions) {
        if (!suggestions.length) {
          suggestionsPanel.innerHTML = '<div class="mp-suggestion-loading">No results found</div>';
          suggestionsPanel.style.display = 'block';
          return;
        }

        acActiveIndex = -1;
        suggestionsPanel.innerHTML = suggestions.map(function(s) {
          return '<div class="mp-suggestion-item" data-videoid="' + (s.video_id || '') + '" data-source="' + (s.source || '') + '" data-title="' + (s.title || '').replace(/"/g, '&quot;') + '" data-artist="' + (s.artist || '').replace(/"/g, '&quot;') + '" data-thumb="' + (s.thumbnail_url || '') + '">' +
            '<img src="' + (s.thumbnail_url || '') + '" alt="" />' +
            '<div>' +
              '<div class="sg-title">' + (s.title || '') + '</div>' +
              '<div class="sg-artist">' + (s.artist || '') + '</div>' +
            '</div>' +
          '</div>';
        }).join('');

        suggestionsPanel.style.display = 'block';

        // Click handler for suggestions
        suggestionsPanel.querySelectorAll('.mp-suggestion-item').forEach(function(item) {
          item.addEventListener('click', function() { selectSuggestion(item); });
        });
      }

      function selectSuggestion(item) {
        var track = {
          video_id: item.dataset.videoid,
          title: item.dataset.title,
          artist: item.dataset.artist,
          thumbnail_url: item.dataset.thumb,
          source: item.dataset.source
        };
        hideSuggestions();
        searchInput.value = track.title;
        // Load the track in the music player
        if (window.musicPlayer) {
          window.musicPlayer.loadTrack(track);
        }
      }

      function hideSuggestions() {
        suggestionsPanel.style.display = 'none';
        suggestionsPanel.innerHTML = '';
        acActiveIndex = -1;
      }

      // Hide suggestions when clicking outside
      document.addEventListener('click', function(e) {
        if (!suggestionsPanel.contains(e.target) && e.target !== searchInput) {
          hideSuggestions();
        }
      });
    })();
  </script>

  <script>
    // --- PanelManager Class (Animation Controller) ---
    class PanelManager {
      constructor(panelElement, toggleButton) {
        this._panel = panelElement;
        this._toggleButton = toggleButton;
        this._state = 'hidden';
        this._transitionEndHandler = null;

        // Detect CSS transition support
        this._supportsTransitions = 'transition' in document.documentElement.style
          || 'webkitTransition' in document.documentElement.style;

        // Initialize: apply panel-hidden class so panel starts hidden
        if (this._panel) {
          this._panel.classList.add('panel-hidden');
          this._panel.classList.remove('panel-visible');
          // Ensure pointer-events: none when hidden
          this._panel.style.pointerEvents = 'none';
        }
      }

      // Current state: 'hidden' | 'animating_in' | 'visible' | 'animating_out'
      get state() {
        return this._state;
      }

      // Trigger show animation: transition from hidden to visible
      show() {
        if (this._state === 'visible' || this._state === 'animating_in') return;
        if (!this._panel) return;

        // Clean up any pending transition listener
        this._removeTransitionListener();

        this._state = 'animating_in';
        // Allow pointer events during show animation
        this._panel.style.pointerEvents = '';

        // Fallback for browsers without CSS transitions: immediate show
        if (!this._supportsTransitions) {
          this._panel.classList.remove('panel-hidden');
          this._panel.classList.add('panel-visible');
          this._state = 'visible';
          this._panel.style.pointerEvents = 'auto';
          return;
        }

        // Remove hidden class and add visible class to trigger CSS transition
        this._panel.classList.remove('panel-hidden');
        // Force a reflow so the browser registers the starting state
        void this._panel.offsetWidth;
        this._panel.classList.add('panel-visible');

        // Listen for transitionend to finalize state
        this._transitionEndHandler = (e) => {
          // Only handle transitions on the panel itself (not children)
          if (e.target !== this._panel) return;
          this._removeTransitionListener();
          this._state = 'visible';
          this._panel.style.pointerEvents = 'auto';
        };
        this._panel.addEventListener('transitionend', this._transitionEndHandler);
      }

      // Trigger hide animation: transition from visible to hidden
      hide() {
        if (this._state === 'hidden' || this._state === 'animating_out') return;
        if (!this._panel) return;

        // Clean up any pending transition listener
        this._removeTransitionListener();

        this._state = 'animating_out';
        // Disable pointer-events immediately when starting to hide (Req 7.3)
        this._panel.style.pointerEvents = 'none';

        // Fallback for browsers without CSS transitions: immediate hide
        if (!this._supportsTransitions) {
          this._panel.classList.remove('panel-visible');
          this._panel.classList.add('panel-hidden');
          this._state = 'hidden';
          return;
        }

        // Remove visible class and add hidden class to trigger CSS transition
        this._panel.classList.remove('panel-visible');
        // Force a reflow so the browser registers the starting state
        void this._panel.offsetWidth;
        this._panel.classList.add('panel-hidden');

        // Listen for transitionend to finalize state
        this._transitionEndHandler = (e) => {
          if (e.target !== this._panel) return;
          this._removeTransitionListener();
          this._state = 'hidden';
        };
        this._panel.addEventListener('transitionend', this._transitionEndHandler);
      }

      // Toggle visibility — handles mid-animation reversal per Req 7.4
      // Req 7.4 takes precedence: cancel current animation and reverse from intermediate state
      toggle() {
        switch (this._state) {
          case 'hidden':
            this.show();
            break;
          case 'visible':
            this.hide();
            break;
          case 'animating_in':
          case 'animating_out':
            // Mid-animation reversal (Req 7.4)
            this._reverseAnimation();
            break;
        }
      }

      // Cancel current transition and reverse from intermediate state (Req 7.4)
      _reverseAnimation() {
        if (!this._panel) return;

        // Clean up the current transition listener
        this._removeTransitionListener();

        // Fallback for browsers without CSS transitions: immediate flip
        if (!this._supportsTransitions) {
          if (this._state === 'animating_in') {
            this._panel.classList.remove('panel-visible');
            this._panel.classList.add('panel-hidden');
            this._state = 'hidden';
            this._panel.style.pointerEvents = 'none';
          } else if (this._state === 'animating_out') {
            this._panel.classList.remove('panel-hidden');
            this._panel.classList.add('panel-visible');
            this._state = 'visible';
            this._panel.style.pointerEvents = 'auto';
          }
          return;
        }

        if (this._state === 'animating_in') {
          // Currently showing → reverse to hiding
          this._state = 'animating_out';
          // Disable pointer-events when animating out
          this._panel.style.pointerEvents = 'none';
          this._panel.classList.remove('panel-visible');
          void this._panel.offsetWidth;
          this._panel.classList.add('panel-hidden');
          this._transitionEndHandler = (e) => {
            if (e.target !== this._panel) return;
            this._removeTransitionListener();
            this._state = 'hidden';
          };
          this._panel.addEventListener('transitionend', this._transitionEndHandler);
        } else if (this._state === 'animating_out') {
          // Currently hiding → reverse to showing
          this._state = 'animating_in';
          // Re-enable pointer-events when animating in
          this._panel.style.pointerEvents = '';
          this._panel.classList.remove('panel-hidden');
          void this._panel.offsetWidth;
          this._panel.classList.add('panel-visible');
          this._transitionEndHandler = (e) => {
            if (e.target !== this._panel) return;
            this._removeTransitionListener();
            this._state = 'visible';
            this._panel.style.pointerEvents = 'auto';
          };
          this._panel.addEventListener('transitionend', this._transitionEndHandler);
        }
      }

      // Remove the current transitionend listener
      _removeTransitionListener() {
        if (this._transitionEndHandler && this._panel) {
          this._panel.removeEventListener('transitionend', this._transitionEndHandler);
          this._transitionEndHandler = null;
        }
      }
    }
  </script>

  <script>
    // --- MusicToggleButton Class ---
    class MusicToggleButton {
      constructor(panelManager) {
        this.panelManager = panelManager;
        this.button = null;
        this.state = 'idle'; // 'idle' | 'playing' | 'disabled'
      }

      // Renders the toggle button into the DOM
      render() {
        this.button = document.createElement('button');
        this.button.id = 'music-toggle-btn';
        this.button.className = 'music-toggle-btn';
        this.button.setAttribute('aria-label', 'Toggle music panel');
        this.button.textContent = '♪';

        // Click handler delegates to PanelManager's toggle()
        this.button.addEventListener('click', () => this._onClick());

        document.body.appendChild(this.button);
      }

      // Updates visual state: idle, playing (pulsing), or disabled
      setState(state) {
        if (!this.button) return;
        // Remove previous state classes
        this.button.classList.remove('playing', 'disabled');
        this.state = state;

        if (state === 'playing') {
          this.button.classList.add('playing');
        } else if (state === 'disabled') {
          this.button.classList.add('disabled');
        }
        // 'idle' has no additional class
      }

      // Click handler — delegates to PanelManager
      _onClick() {
        if (this.state === 'disabled') return;
        if (this.panelManager && typeof this.panelManager.toggle === 'function') {
          this.panelManager.toggle();
        }
      }
    }

    // Instantiate PanelManager with the music-panel element (or fallback to music-player)
    const musicPanelEl = document.querySelector('.music-panel') || document.getElementById('music-player');
    window.panelManager = new PanelManager(musicPanelEl, null);

    // Instantiate and render the toggle button with the PanelManager wired in
    window.musicToggleButton = new MusicToggleButton(window.panelManager);
    window.musicToggleButton.render();

    // Wire the toggle button reference back into PanelManager
    window.panelManager._toggleButton = window.musicToggleButton;

    // --- Backdrop-filter runtime detection and fallback ---
    // Belt-and-suspenders alongside the @supports CSS rule for older browsers
    (function() {
      const supportsBackdrop = (CSS && CSS.supports) &&
        (CSS.supports('backdrop-filter', 'blur(1px)') ||
         CSS.supports('-webkit-backdrop-filter', 'blur(1px)'));

      if (!supportsBackdrop) {
        const panel = document.querySelector('.music-panel') || document.getElementById('music-player');
        if (panel) {
          panel.classList.add('no-backdrop-filter');
        }
      }
    })();
  </script>

  <!-- Hidden container for YouTube IFrame Player (uses the one inside the legacy panel) -->
