version: "3.8"

# =============================================================================
# Personal AI Assistant - Production Docker Compose
# =============================================================================
# Prerequisites:
#   - NVIDIA Container Toolkit installed for GPU services
#   - TLS certificates in ./certs/ directory
#   - .env file configured (copy from .env.example)
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose ps             # Check service status
#   docker compose logs -f app    # Follow app logs
#   docker compose down           # Stop all services
# =============================================================================

services:
  # ===========================================================================
  # Core Application: API Gateway + Orchestrator
  # ===========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: pai-app
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - APP_PORT=3000
      - API_KEY=${API_KEY}
      - REDIS_URL=redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - VLLM_URL=http://vllm:8000
      - STT_URL=http://stt:8001
      - TTS_URL=http://tts:8002
      - EMBEDDING_URL=http://embeddings:8003
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - TLS_CERT_PATH=/certs/server.crt
      - TLS_KEY_PATH=/certs/server.key
      - TLS_CA_PATH=/certs/ca.crt
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.7}
      - RAG_TOP_K=${RAG_TOP_K:-5}
      - RAG_RELEVANCE_THRESHOLD=${RAG_RELEVANCE_THRESHOLD:-0.7}
      - SESSION_SILENCE_TIMEOUT_SECONDS=${SESSION_SILENCE_TIMEOUT_SECONDS:-60}
      - SESSION_MAX_EXCHANGES=${SESSION_MAX_EXCHANGES:-50}
      - RESOURCE_ALERT_THRESHOLD_PERCENT=${RESOURCE_ALERT_THRESHOLD_PERCENT:-80}
      - ALERT_NOTIFICATION_CHANNEL=${ALERT_NOTIFICATION_CHANNEL:-webhook}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ACCESS_LOG_RETENTION_DAYS=${ACCESS_LOG_RETENTION_DAYS:-90}
      - TRAINING_OPT_IN=${TRAINING_OPT_IN:-false}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - WEB_SEARCH_API_KEY=${WEB_SEARCH_API_KEY:-}
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - FINANCE_API_KEY=${FINANCE_API_KEY:-}
      - FINE_TUNING_MIN_EXAMPLES=${FINE_TUNING_MIN_EXAMPLES:-50}
      - MODEL_ROLLBACK_THRESHOLD=${MODEL_ROLLBACK_THRESHOLD:-0.60}
    volumes:
      - app-logs:/app/logs
      - ./certs:/certs:ro
    networks:
      - ai-external
      - ai-internal
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      vllm:
        condition: service_healthy
      stt:
        condition: service_healthy
      tts:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ===========================================================================
  # vLLM Inference Engine - Fine-tuned Mistral 7B (GPU Required)
  # ===========================================================================
  vllm:
    image: vllm/vllm-openai:latest
    container_name: pai-vllm
    environment:
      - NVIDIA_VISIBLE_DEVICES=${VLLM_NVIDIA_DEVICES:-all}
      - VLLM_MODEL_PATH=${VLLM_MODEL_PATH:-/models/mistral-7b-finetuned}
    command: >
      --model ${VLLM_MODEL_PATH:-/models/mistral-7b-finetuned}
      --host 0.0.0.0
      --port 8000
      --max-model-len ${VLLM_MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      --dtype ${VLLM_DTYPE:-float16}
      --trust-remote-code
    volumes:
      - model-weights:/models:ro
      - ./certs:/certs:ro
    networks:
      - ai-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 32G
        reservations:
          cpus: "2.0"
          memory: 16G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  # ===========================================================================
  # Faster-Whisper - Speech-to-Text (GPU-accelerated)
  # ===========================================================================
  stt:
    image: fedirz/faster-whisper-server:latest
    container_name: pai-stt
    environment:
      - NVIDIA_VISIBLE_DEVICES=${STT_NVIDIA_DEVICES:-all}
      - WHISPER__MODEL=${WHISPER_MODEL_SIZE:-large-v3}
      - WHISPER__DEVICE=${WHISPER_DEVICE:-cuda}
      - WHISPER__COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-float16}
    volumes:
      - stt-models:/root/.cache
      - ./certs:/certs:ro
    networks:
      - ai-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===========================================================================
  # Coqui TTS (XTTS v2) - Text-to-Speech (GPU-accelerated)
  # ===========================================================================
  tts:
    image: ghcr.io/coqui-ai/tts:latest
    container_name: pai-tts
    environment:
      - NVIDIA_VISIBLE_DEVICES=${TTS_NVIDIA_DEVICES:-all}
      - TTS_MODEL_NAME=${TTS_MODEL_NAME:-tts_models/multilingual/multi-dataset/xtts_v2}
      - CUDA_VISIBLE_DEVICES=${TTS_CUDA_DEVICES:-0}
    volumes:
      - tts-models:/root/.local/share/tts
      - ./certs:/certs:ro
    networks:
      - ai-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 6G
        reservations:
          cpus: "1.0"
          memory: 3G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ===========================================================================
  # Sentence-Transformers Embedding Service - Vector Embeddings for RAG
  # ===========================================================================
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.2
    container_name: pai-embeddings
    command: >
      --model-id ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      --port 8003
      --max-concurrent-requests 64
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - embedding-models:/data
      - ./certs:/certs:ro
    networks:
      - ai-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8003/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # Qdrant Vector Database - Knowledge Store
  # ===========================================================================
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: pai-qdrant
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
      - QDRANT__SERVICE__ENABLE_TLS=${QDRANT_ENABLE_TLS:-false}
      - QDRANT__TLS__CERT=/certs/server.crt
      - QDRANT__TLS__KEY=/certs/server.key
    volumes:
      - qdrant-data:/qdrant/storage
      - ./certs:/certs:ro
    networks:
      - ai-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # Redis - Session Management & Caching (AOF persistence)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: pai-redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
      --tls-port 6380
      --tls-cert-file /certs/server.crt
      --tls-key-file /certs/server.key
      --tls-ca-cert-file /certs/ca.crt
      --tls-auth-clients no
    volumes:
      - redis-data:/data
      - ./certs:/certs:ro
    networks:
      - ai-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

# =============================================================================
# Named Volumes - Persistent Data
# =============================================================================
volumes:
  # Qdrant vector database storage
  qdrant-data:
    driver: local
    name: pai-qdrant-data

  # Redis AOF persistence
  redis-data:
    driver: local
    name: pai-redis-data

  # Application logs (access logs, audit logs)
  app-logs:
    driver: local
    name: pai-app-logs

  # LLM model weights (base model + LoRA adapters)
  model-weights:
    driver: local
    name: pai-model-weights

  # Faster-Whisper STT model cache
  stt-models:
    driver: local
    name: pai-stt-models

  # Coqui TTS model cache
  tts-models:
    driver: local
    name: pai-tts-models

  # Sentence-transformers embedding model cache
  embedding-models:
    driver: local
    name: pai-embedding-models

# =============================================================================
# Networks
# =============================================================================
# ai-external: Exposes the API gateway to the host. Only the app service joins.
# ai-internal: Isolated bridge for service-to-service communication with TLS.
#              Backend services (vLLM, Qdrant, Redis, STT, TTS) are NOT
#              reachable from outside the Docker network.
# =============================================================================
networks:
  ai-external:
    driver: bridge
    name: pai-external

  ai-internal:
    driver: bridge
    name: pai-internal
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
